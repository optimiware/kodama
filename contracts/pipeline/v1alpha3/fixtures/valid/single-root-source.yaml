apiVersion: kodama/v1alpha3
kind: Pipeline
metadata: {name: single-root-source}
spec:
  timeoutSeconds: 1800
  sources:
    - {repository: inventory, path: ".", access: write}
  steps:
    - id: format
      kind: container
      image: registry.example.invalid/go-tools@sha256:3333333333333333333333333333333333333333333333333333333333333333
      workspace: {access: write}
      command: [/bin/sh, -ec]
      args: ["cd /workspace && gofmt -w ."]
      timeoutSeconds: 300
