apiVersion: kodama/v1alpha2
kind: Pipeline
metadata: {name: order-gates}
spec:
  timeoutSeconds: 7200
  steps:
    - {id: test, kind: container, image: registry.example.invalid/tools@sha256:1111111111111111111111111111111111111111111111111111111111111111, command: [/bin/true], timeoutSeconds: 60, workspace: {access: write}}
    - {id: review, kind: gate, needs: [test]}
    - {id: build, kind: container, needs: [review], image: registry.example.invalid/tools@sha256:1111111111111111111111111111111111111111111111111111111111111111, command: [/bin/true], timeoutSeconds: 60}
    - {id: lint, kind: container, image: registry.example.invalid/tools@sha256:1111111111111111111111111111111111111111111111111111111111111111, command: [/bin/true], timeoutSeconds: 60}
