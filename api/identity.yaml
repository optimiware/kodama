openapi: 3.0.3
info:
  title: Kodama identity, tenancy and RBAC
  version: 1.0.0
  description: >-
    Verified caller discovery, tenant and project discovery, fixed-role bindings
    ("memberships") and project settings of the standalone authority profile
    (docs/specs/identity-tenancy-and-rbac.md, docs/contracts/http-api.md). Owned by T-010.
    Shared conventions (ETags, If-Match, error envelope, list pagination) come from
    api/common.yaml. Types are generated into internal/identity/http/identity.gen.go (see
    internal/identity/http/generate.go). Routes are relative to /api/v1.


    These routes implement the standalone authority only. They never grant platform
    membership or entitlements, never issue tokens and expose no bootstrap route:
    bootstrap is an operator-only command. An Optimi-hosted installation selects a
    different authority (docs/specs/platform-integration.md, O-18/T-061).
paths:
  /me:
    get:
      operationId: getMe
      summary: The verified caller
      description: >-
        Returns only the caller identified by the verified access token: the stable user
        ID, issuer and subject. It requires no membership. No selector is accepted.
      responses:
        '200':
          description: The caller.
          headers:
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                id: u_0f3a5c9e1b7d4a6e8c2b4d6f8a0c2e4a
                issuer: https://login.example.test
                subject: 'oauthsonas|engineer'
                createdAt: '2026-10-20T09:00:00Z'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
  /tenants:
    get:
      operationId: listTenants
      summary: Discover the caller's tenants
      description: >-
        Lists only tenants where the verified caller holds at least one binding, ordered by
        ID. A caller without bindings receives an empty list, never an error; an outage is a
        503, never an empty list. The cursor is bound to the caller and grants no access.
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of tenants.
          headers:
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPage'
              example:
                items:
                  - id: t_acme
                    key: acme
                    displayName: Acme
                    roles: [admin]
                nextCursor: null
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
  /tenants/{tenantId}/memberships:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: listMemberships
      summary: List role bindings
      description: >-
        Lists the bindings of every scope the caller administers: all of the tenant for a
        tenant-wide administrator, otherwise only the administered projects. The projectId
        and userId filters narrow the result and never widen it. Ordered by ID; the cursor is
        bound to the caller, tenant and filters.
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            $ref: 'common.yaml#/components/schemas/ID'
        - name: userId
          in: query
          required: false
          schema:
            $ref: 'common.yaml#/components/schemas/ID'
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of bindings.
          headers:
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
    post:
      operationId: createMembership
      summary: Grant a fixed role
      description: >-
        Binds an existing user (one who has signed in at least once) to one of the five fixed
        roles at tenant scope or, with projectId, at project scope. A tenant-wide binding needs
        a tenant-wide administrator; a project binding needs administration of that project.
        The binding takes effect and is audited atomically; an existing identical binding is
        409 already_exists and records nothing. After an uncertain result, list the user's
        bindings before retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMembership'
            example:
              userId: u_0f3a5c9e1b7d4a6e8c2b4d6f8a0c2e4a
              projectId: p_inventory
              role: reviewer
      responses:
        '201':
          description: Granted.
          headers:
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
            Location:
              schema:
                type: string
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '413':
          $ref: 'common.yaml#/components/responses/PayloadTooLarge'
        '415':
          $ref: 'common.yaml#/components/responses/UnsupportedMediaType'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
  /tenants/{tenantId}/memberships/{id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/MembershipId'
    patch:
      operationId: updateMembership
      summary: Change a binding's role
      description: >-
        Moves the binding to another fixed role under If-Match. Scope and user are immutable.
        The same role is a no-op that returns the current binding. Access changes with the
        commit.
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembership'
            example:
              role: viewer
      responses:
        '200':
          description: The updated binding.
          headers:
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '412':
          $ref: 'common.yaml#/components/responses/PreconditionFailed'
        '413':
          $ref: 'common.yaml#/components/responses/PayloadTooLarge'
        '415':
          $ref: 'common.yaml#/components/responses/UnsupportedMediaType'
        '428':
          $ref: 'common.yaml#/components/responses/PreconditionRequired'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
    delete:
      operationId: deleteMembership
      summary: Revoke a binding
      description: >-
        Removes the binding under If-Match. The user's access through it ends with the commit:
        a still-valid token loses it immediately. A repeated revocation is 404.
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      responses:
        '204':
          description: Revoked.
          headers:
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '412':
          $ref: 'common.yaml#/components/responses/PreconditionFailed'
        '428':
          $ref: 'common.yaml#/components/responses/PreconditionRequired'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
  /tenants/{tenantId}/projects:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: listProjects
      summary: Discover projects
      description: >-
        Lists the projects the caller may read: every project for a tenant-wide binding,
        otherwise only the bound projects. Ordered by ID; the cursor is bound to the caller
        and tenant and every page is authorized again.
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of projects.
          headers:
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
    post:
      operationId: createProject
      summary: Create a project
      description: >-
        Creates a project at version 1 for a tenant-wide administrator. The key is unique in
        the tenant and immutable; a duplicate key is 409 already_exists and records nothing.
        After an uncertain result, read the project list before retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
            example:
              key: inventory
              displayName: Inventory
              activeWipLimit: 5
      responses:
        '201':
          description: Created.
          headers:
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
            Location:
              schema:
                type: string
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '413':
          $ref: 'common.yaml#/components/responses/PayloadTooLarge'
        '415':
          $ref: 'common.yaml#/components/responses/UnsupportedMediaType'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
  /tenants/{tenantId}/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      summary: Read a project
      responses:
        '200':
          description: The project; the ETag is its version.
          headers:
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
    patch:
      operationId: updateProject
      summary: Update settings, the active work limit and project role bindings
      description: >-
        Replaces the supplied fields under If-Match; omitted fields are unchanged. The key and
        ownership cannot be changed. settings replaces the whole settings object.
        roleBindings grants and revokes bindings of THIS project through the same checks,
        audit and events as the membership routes; it cannot create tenant-wide bindings or
        touch another project, and needs administration of the project. Every accepted change
        advances the project version exactly once, including binding changes made through
        either entry point.
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProject'
            example:
              displayName: Inventory
              activeWipLimit: 8
              roleBindings:
                grant:
                  - userId: u_0f3a5c9e1b7d4a6e8c2b4d6f8a0c2e4a
                    role: engineer
                revoke: [mb_7b1d0c2e4a6f8b0d2c4e6a8f0b2d4c6e]
      responses:
        '200':
          description: The updated project.
          headers:
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '412':
          $ref: 'common.yaml#/components/responses/PreconditionFailed'
        '413':
          $ref: 'common.yaml#/components/responses/PayloadTooLarge'
        '415':
          $ref: 'common.yaml#/components/responses/UnsupportedMediaType'
        '428':
          $ref: 'common.yaml#/components/responses/PreconditionRequired'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
components:
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        $ref: 'common.yaml#/components/schemas/ID'
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: 'common.yaml#/components/schemas/ID'
    MembershipId:
      name: id
      in: path
      required: true
      schema:
        $ref: 'common.yaml#/components/schemas/ID'
  schemas:
    Role:
      type: string
      enum: [admin, analyst, engineer, reviewer, viewer]
      description: >-
        One of the five fixed roles. There are no custom roles. admin manages membership,
        settings and credentials but is not a reviewer and never reads secret plaintext;
        reviewer alone decides gates and completes work (human actors only).
    Me:
      type: object
      required: [id, issuer, subject, createdAt]
      additionalProperties: false
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/ID'
        issuer:
          type: string
          maxLength: 512
        subject:
          type: string
          maxLength: 512
        createdAt:
          type: string
          format: date-time
    Tenant:
      type: object
      required: [id, key, displayName, roles]
      additionalProperties: false
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/ID'
        key:
          type: string
        displayName:
          type: string
          maxLength: 256
        roles:
          type: array
          description: The caller's distinct tenant-wide roles; empty for a caller bound only to projects.
          maxItems: 5
          items:
            $ref: '#/components/schemas/Role'
    TenantPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Tenant'
        nextCursor:
          type: string
          nullable: true
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
    Membership:
      type: object
      required: [id, userId, role, version, createdAt]
      additionalProperties: false
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/ID'
        userId:
          $ref: 'common.yaml#/components/schemas/ID'
        projectId:
          allOf:
            - $ref: 'common.yaml#/components/schemas/ID'
          description: Present for a project binding; absent for a tenant-wide binding.
        role:
          $ref: '#/components/schemas/Role'
        version:
          $ref: 'common.yaml#/components/schemas/Version'
        createdAt:
          type: string
          format: date-time
    MembershipPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Membership'
        nextCursor:
          type: string
          nullable: true
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
    CreateMembership:
      type: object
      required: [userId, role]
      additionalProperties: false
      properties:
        userId:
          $ref: 'common.yaml#/components/schemas/ID'
        projectId:
          $ref: 'common.yaml#/components/schemas/ID'
        role:
          $ref: '#/components/schemas/Role'
    UpdateMembership:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/Role'
    Project:
      type: object
      required: [id, key, displayName, settings, activeWipLimit, version, createdAt, updatedAt, callerRoles]
      additionalProperties: false
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/ID'
        key:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$'
        displayName:
          type: string
          maxLength: 256
        settings:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
          description: Validated, bounded (16 KiB, 64 members, depth 6) project settings.
        activeWipLimit:
          type: integer
          minimum: 1
          maximum: 100000
        version:
          $ref: 'common.yaml#/components/schemas/Version'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        callerRoles:
          type: array
          description: The caller's roles that reach this project (tenant-wide and project bindings).
          maxItems: 5
          items:
            $ref: '#/components/schemas/Role'
    ProjectPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Project'
        nextCursor:
          type: string
          nullable: true
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
    CreateProject:
      type: object
      required: [key]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$'
        displayName:
          type: string
          maxLength: 256
        settings:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
        activeWipLimit:
          type: integer
          minimum: 1
          maximum: 100000
          description: Defaults to 5.
    BindingGrant:
      type: object
      required: [userId, role]
      additionalProperties: false
      properties:
        userId:
          $ref: 'common.yaml#/components/schemas/ID'
        role:
          $ref: '#/components/schemas/Role'
    RoleBindingsPatch:
      type: object
      additionalProperties: false
      properties:
        grant:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/BindingGrant'
        revoke:
          type: array
          maxItems: 20
          description: Binding IDs of this project to revoke.
          items:
            $ref: 'common.yaml#/components/schemas/ID'
    UpdateProject:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          maxLength: 256
        settings:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
        activeWipLimit:
          type: integer
          minimum: 1
          maximum: 100000
        roleBindings:
          $ref: '#/components/schemas/RoleBindingsPatch'
