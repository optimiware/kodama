        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/Unavailable'
      summary: List registered agent profile versions
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      description: 'The request body is one JSON profile. The server authorizes the caller, validates the profile, requires compatibility evidence for the exact image, wrapper, wrapper command and harness combination and for every control the profile claims, requires the model and tools to be approved for the project, and registers an immutable version. An unqualified combination or unsupported claimed control is `profile_unsupported` (422) and writes nothing. Content that is canonically identical to an existing profile of the project returns that version with 200 and creates nothing; any other content under a name creates the next version of that name with 201. Neither If-Match nor Idempotency-Key is required because registration is content-addressed: a retry after a lost response converges on the same version. A 503 may mean the outcome is unknown; retrying is safe. Unknown fields and duplicate keys are rejected with 400. Credentials never belong in a profile: the model endpoint is a credential-free https URL and provider credentials stay with the AI gateway.'
      operationId: registerAgentProfile
      requestBody:
        content:
          application/json:
            example:
              $ref: '#/components/examples/ProfileDraft/value'
            schema:
              $ref: '#/components/schemas/AgentProfileDraft'
        required: true
