      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/RunId'
    post:
      description: Requires run:manage. Idempotently records the cancellation request and returns 202 with the run's current state and cancelRequestedAt. New dispatch is refused from the commit on, live attempts lose their authority at once and their workloads are terminated; the run stays nonterminal until admitted work and known side effects are settled. Cancelling a run that is already terminal changes nothing. The request carries no body.
      operationId: cancelRun
      responses:
        "202":
          content:
            application/json:
              example:
                $ref: '#/components/examples/CancellingRun/value'
              schema:
                $ref: '#/components/schemas/Run'
          description: The request was recorded. Poll the run until it is terminal.
