  /tenants/{tenantId}/projects/{projectId}/runs/{id}/events:
    get:
      description: Same representations and cursor rules as the project stream, narrowed to the run's own events (matched by the run's resource id) and its step-attempt events (matched by the typed runId payload member, never by correlation id). Requires run:read. The run must exist in the project; otherwise 404, identical to a hidden run.
