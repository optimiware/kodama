    post:
      description: 'The request body is one JSON Pipeline document. The server authorizes the caller, parses and validates the document, and registers it as an immutable version. Content that is canonically identical to an existing definition of the project returns that definition with 200 and creates nothing; any other content under a name creates the next version of that name with 201. Neither If-Match nor Idempotency-Key is required because registration is content-addressed: a retry after a lost response converges on the same definition. A 503 may mean the outcome is unknown; retrying is safe. Only step kinds the installation enables are accepted. The schema describes the planned agent and gate shapes, but an installation that does not enable them rejects such documents with kind_disabled.'
      operationId: registerPipelineDefinition
