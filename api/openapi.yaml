      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/RunId'
  /tenants/{tenantId}/projects/{projectId}/runs/{id}/logs:
    get:
      description: '`source=auto` (the default) serves the live log of a running attempt and the retained log of a finished one, falling back to the other when the first is unavailable. `follow=true` keeps a live stream open until the attempt''s log ends, the server''s duration bound passes or the caller''s access changes; it is rejected for a finished attempt and for retained sources. Output is bounded in lines, bytes, line length and duration; a bound that cuts the output is reported in `summary`. Known injected secret values are replaced with `[REDACTED]` before emission or storage; arbitrary tenant output still requires access control.'
      operationId: getRunLogs
      parameters:
        - description: The attempt of the run. Required when the run has more than one attempt; an ambiguous selection is 400 invalid_request.
          in: query
          name: attemptId
          required: false
          schema:
            $ref: '#/components/schemas/ID'
        - description: Number of trailing lines. Values outside 1..the server maximum are rejected, never clamped. The default is a conservative 100.
          in: query
          name: tail
          required: false
          schema:
            default: 100
            minimum: 1
            type: integer
        - description: Keep a live stream open (live source only).
          in: query
          name: follow
          required: false
          schema:
            default: false
            type: boolean
        - description: 'Where to read from: the live Kubernetes log, or the retained capture of one producer. Captures of different sources are never merged.'
          in: query
          name: source
          required: false
          schema:
            $ref: '#/components/schemas/LogSource'
      responses:
        "200":
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/LogRecord'
          description: A bounded NDJSON stream of `meta`, `chunk` and `summary` records.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                enum:
                  - no-store
                type: string
            X-Content-Type-Options:
              description: Always `nosniff`.
              schema:
                enum:
                  - nosniff
                type: string
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
      summary: Stream the bounded log of one attempt
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/RunId'
