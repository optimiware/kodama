          type: integer
        evidence:
          items:
            $ref: '#/components/schemas/EvidenceRef'
          maxItems: 50
          type: array
        recordedAt:
          format: date-time
          type: string
      required:
        - contentRevision
        - recordedAt
      type: object
    RevokeSecretVersionRequest:
      additionalProperties: false
      properties:
        reason:
          description: Free text recorded in the audit entry. Never put secret values in it.
          maxLength: 2048
          type: string
      type: object
    RevokeSecretVersionResult:
      additionalProperties: false
      properties:
        consumerHandling:
          $ref: '#/components/schemas/ConsumerHandlingSummary'
        secret:
          $ref: '#/components/schemas/Secret'
        version:
          $ref: '#/components/schemas/SecretVersion'
      required:
        - secret
        - version
        - consumerHandling
      type: object
    Role:
      description: One of the five fixed roles. There are no custom roles. admin manages membership, settings and credentials but is not a reviewer and never reads secret plaintext; reviewer alone decides gates and completes work (human actors only).
      enum:
        - admin
        - analyst
        - engineer
        - reviewer
        - viewer
      type: string
    RoleBindingsPatch:
      additionalProperties: false
      properties:
        grant:
          items:
            $ref: '#/components/schemas/BindingGrant'
          maxItems: 20
          type: array
        revoke:
          description: Binding IDs of this project to revoke.
          items:
            $ref: '#/components/schemas/ID'
          maxItems: 20
          type: array
      type: object
    Run:
      additionalProperties: false
      properties:
        cancelRequestedAt:
          format: date-time
          nullable: true
          type: string
        contentRevision:
          format: int64
          nullable: true
          type: integer
        createdAt:
          format: date-time
          type: string
        definitionDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        definitionId:
          $ref: '#/components/schemas/ID'
        failureReason:
          allOf:
            - $ref: '#/components/schemas/Reason'
          description: The recorded failure intent; the run fails once its attempts settle.
          nullable: true
        finishedAt:
          format: date-time
          nullable: true
          type: string
        id:
          $ref: '#/components/schemas/ID'
        inputSnapshot:
          $ref: '#/components/schemas/InputSnapshot'
        purpose:
          description: Only work runs are created through this API.
          enum:
            - work
            - cleanup
          type: string
        reason:
          $ref: '#/components/schemas/Reason'
        requestedBy:
          $ref: '#/components/schemas/RunsActor'
        sourceCommit:
          nullable: true
          type: string
        sourceRetention:
          description: A work run dispatches only after its retained source reference is confirmed.
          enum:
            - not_required
            - pending
            - confirmed
          type: string
        startedAt:
          format: date-time
          nullable: true
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        version:
          $ref: '#/components/schemas/Version'
        workItemId:
          nullable: true
          type: string
      required:
        - id
        - purpose
        - workItemId
        - definitionId
        - definitionDigest
        - contentRevision
        - sourceCommit
        - status
        - reason
        - cancelRequestedAt
        - failureReason
        - inputSnapshot
        - requestedBy
        - sourceRetention
        - version
        - createdAt
        - startedAt
        - finishedAt
      type: object
    RunPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Run'
          maxItems: 200
          type: array
        nextCursor:
          nullable: true
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
          type: string
      required:
        - items
        - nextCursor
      type: object
    RunStatus:
      enum:
        - queued
        - running
        - succeeded
        - failed
        - cancelled
      type: string
    RunsActor:
      additionalProperties: false
      properties:
        id:
          maxLength: 256
          minLength: 1
          type: string
        type:
          enum:
            - user
            - service
            - workload
            - operator
          type: string
      required:
        - type
        - id
      type: object
    RunsScalar:
      description: A string, boolean or integer (an artifact is carried as its artifact ID string).
      oneOf:
        - maxLength: 4096
          type: string
        - type: boolean
        - format: int64
          type: integer
    RuntimeDeploymentRegister:
      additionalProperties: false
      properties:
        image:
          $ref: '#/components/schemas/Image'
        source:
          $ref: '#/components/schemas/Source'
      required:
        - source
        - image
      type: object
    Scalar:
      description: A string (at most 4096 bytes), boolean or integer within +/-(2^53-1).
      oneOf:
        - maxLength: 4096
          type: string
        - type: boolean
        - maximum: 9007199254740991
          minimum: -9007199254740991
          type: integer
    Secret:
      additionalProperties: false
      description: Metadata only. There is no value, ciphertext, nonce, key or fingerprint member.
      properties:
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        currentVersion:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: Highest value version. It may be revoked, in which case no version is pinnable until a new one is added.
        deletedAt:
          format: date-time
          nullable: true
          type: string
        id:
          $ref: '#/components/schemas/ID'
        kind:
          $ref: '#/components/schemas/SecretKind'
        name:
          $ref: '#/components/schemas/SecretName'
        ref:
          $ref: '#/components/schemas/SecretRef'
        retention:
          allOf:
            - $ref: '#/components/schemas/RetentionReport'
          description: Present only on a deleted secret.
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        version:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: Resource version (the ETag).
      required:
        - id
        - name
        - kind
        - ref
        - currentVersion
        - version
        - createdAt
        - updatedAt
        - deletedAt
      type: object
    SecretDelivery:
      enum:
        - file
        - env
      type: string
    SecretKind:
      description: Immutable payload type. Provider-specific credential schemas are interpreted by their consumers, not by this API.
      enum:
        - generic
        - git
        - model
        - mcp
        - kubeconfig
      type: string
    SecretName:
      description: Immutable. Referenced from pipelines as secret://project/{name}.
      pattern: ^[a-z][a-z0-9-]{0,62}$
      type: string
    SecretPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Secret'
          maxItems: 200
          type: array
        nextCursor:
          nullable: true
          type: string
      required:
        - items
        - nextCursor
      type: object
    SecretRef:
      pattern: ^secret://project/[a-z][a-z0-9-]{0,62}$
      type: string
    SecretVersion:
      additionalProperties: false
      description: Metadata only.
      properties:
        algorithm:
          description: Envelope algorithm identifier.
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        createdBy:
          description: Authenticated principal that created the version.
          type: string
        keyGeneration:
          description: Tenant scope key generation that protects the value.
          minimum: 1
          type: integer
        revokedAt:
          format: date-time
          nullable: true
          type: string
        secretId:
          $ref: '#/components/schemas/ID'
        version:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: Value version.
      required:
        - secretId
        - version
        - algorithm
        - keyGeneration
        - createdAt
        - createdBy
        - revokedAt
      type: object
    SecretVersionPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/SecretVersion'
          maxItems: 200
          type: array
        nextCursor:
          nullable: true
          type: string
      required:
        - items
        - nextCursor
      type: object
    SecretVersionResult:
      additionalProperties: false
      properties:
        secret:
          $ref: '#/components/schemas/Secret'
        version:
          $ref: '#/components/schemas/SecretVersion'
      required:
        - secret
        - version
      type: object
    Snapshot:
      additionalProperties: false
      description: 'Complete current state of the stream''s projection and the cursor it is consistent with: every event committed at or before the cursor is reflected and every later event is not. A snapshot larger than the configured bound is refused with 503 snapshot_too_large and never truncated.'
      properties:
        cursor:
          $ref: '#/components/schemas/Cursor'
        resources:
          items:
            $ref: '#/components/schemas/ObservedResource'
          type: array
      required:
        - cursor
        - resources
      type: object
    Source:
      additionalProperties: false
      properties:
        commit:
          pattern: ^([0-9a-f]{40}|[0-9a-f]{64})$
          type: string
        repositoryUrl:
          description: A repository URL without credentials.
          pattern: ^https://[^\s@/?#]+(/[^\s@?#]*)?$
          type: string
      required:
        - repositoryUrl
        - commit
      type: object
    SourceProvenance:
      additionalProperties: false
      description: The trusted source the producing attempt worked from.
      properties:
        commit:
          pattern: ^([0-9a-f]{40}|[0-9a-f]{64})$
          type: string
        repositoryUrl:
          pattern: ^https://[^\s@/?#]+(/[^\s@?#]*)?$
          type: string
      required:
        - repositoryUrl
        - commit
      type: object
    SourceRef:
      additionalProperties: false
      properties:
        path:
          pattern: ^(\.?[A-Za-z0-9_-][A-Za-z0-9._-]*)(/\.?[A-Za-z0-9_-][A-Za-z0-9._-]*)*$
          type: string
        repository:
          pattern: ^https://[^\s@/?#]+(/[^\s@?#]*)?$
          type: string
        revision:
          description: A Git object ID. Branches and tags are moving references and are rejected.
          pattern: ^([0-9a-f]{40}|[0-9a-f]{64})$
          type: string
      required:
        - repository
        - revision
        - path
      type: object
    Step:
      additionalProperties: false
      properties:
        actionKey:
          description: Stable across the step's attempts.
          type: string
        attempts:
          items:
            $ref: '#/components/schemas/Attempt'
          type: array
        attemptsStarted:
          minimum: 0
          type: integer
        id:
          pattern: ^[a-z][a-z0-9-]{0,62}$
          type: string
        kind:
          enum:
            - container
            - agent
            - gate
          type: string
        maxAttempts:
          minimum: 1
          type: integer
        nextAttemptAt:
          description: The persisted retry backoff of a pending step.
          format: date-time
          nullable: true
          type: string
        outputs:
          additionalProperties:
            $ref: '#/components/schemas/RunsScalar'
          description: Finalized success outputs; null unless the step succeeded.
          nullable: true
          type: object
        reason:
          $ref: '#/components/schemas/Reason'
        sourceCommit:
          description: A successful writer's published commit.
          nullable: true
          type: string
        status:
          $ref: '#/components/schemas/StepStatus'
      required:
        - id
        - kind
        - status
        - reason
        - nextAttemptAt
        - actionKey
        - attemptsStarted
        - maxAttempts
        - outputs
        - sourceCommit
        - attempts
      type: object
    StepPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Step'
          maxItems: 200
          type: array
        nextCursor:
          nullable: true
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
          type: string
      required:
        - items
        - nextCursor
      type: object
    StepStatus:
      enum:
        - pending
        - running
        - succeeded
        - failed
        - skipped
        - cancelled
      type: string
    Subject:
      additionalProperties: false
      description: The single subject shape. Evidence is sorted by (id, digest). Deployment fields are both null for a source-only gate.
      properties:
        candidateCommit:
          $ref: '#/components/schemas/GitCommit'
        contentRevision:
          $ref: '#/components/schemas/Version'
        definitionId:
          $ref: '#/components/schemas/ID'
        deploymentConfigDigest:
          nullable: true
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        deploymentId:
          nullable: true
          type: string
        evidence:
          items:
            $ref: '#/components/schemas/GatesEvidenceRef'
          maxItems: 256
          type: array
        projectId:
          $ref: '#/components/schemas/ID'
        tenantId:
          $ref: '#/components/schemas/ID'
        workItemId:
          $ref: '#/components/schemas/ID'
      required:
        - tenantId
        - projectId
        - workItemId
        - contentRevision
        - candidateCommit
        - definitionId
        - evidence
        - deploymentId
        - deploymentConfigDigest
      type: object
    Tenant:
      additionalProperties: false
      properties:
        displayName:
          maxLength: 256
          type: string
        id:
          $ref: '#/components/schemas/ID'
        key:
          type: string
        roles:
          description: The caller's distinct tenant-wide roles; empty for a caller bound only to projects.
          items:
            $ref: '#/components/schemas/Role'
          maxItems: 5
          type: array
      required:
        - id
        - key
        - displayName
        - roles
      type: object
    TenantPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Tenant'
          maxItems: 200
          type: array
        nextCursor:
          nullable: true
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
          type: string
      required:
        - items
        - nextCursor
      type: object
    Timestamp:
      description: UTC instant.
      format: date-time
      type: string
    ToolName:
      description: A remote tool name. The slash is reserved by the qualified form registrationId/toolName.
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
      type: string
    Transcript:
      additionalProperties: false
      properties:
        record:
          description: Whether the wrapper records a transcript as a sensitive diagnostic artifact. Result, usage and profile metadata stay attributable either way.
          type: boolean
      required:
        - record
      type: object
    TransitionRequest:
      additionalProperties: false
      properties:
        completion:
          $ref: '#/components/schemas/CompletionClaim'
        reason:
          maxLength: 2048
          type: string
        review:
          $ref: '#/components/schemas/ReviewClaim'
        to:
          $ref: '#/components/schemas/WorkState'
      required:
        - to
      type: object
    UpdateMembership:
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/Role'
      required:
        - role
      type: object
    UpdateProject:
      additionalProperties: false
      properties:
        activeWipLimit:
          maximum: 100000
          minimum: 1
          type: integer
        displayName:
          maxLength: 256
          type: string
        roleBindings:
          $ref: '#/components/schemas/RoleBindingsPatch'
        settings:
          additionalProperties: true
          type: object
      type: object
    UpdateVariableRequest:
      additionalProperties: false
      minProperties: 1
      properties:
        description:
          maxLength: 1024
          type: string
        value:
          $ref: '#/components/schemas/Scalar'
      type: object
    UpdateWorkItem:
      additionalProperties: false
      description: Fields omitted are unchanged. assigneeId, parentId and blockedReason accept null to clear. The server rejects null for the other fields.
      minProperties: 1
      properties:
        acceptanceCriteria:
          items:
            $ref: '#/components/schemas/AcceptanceCriterion'
          maxItems: 100
          type: array
        assigneeId:
          nullable: true
          type: string
        blockedReason:
          maxLength: 2048
          nullable: true
          type: string
        evidenceLinks:
          items:
            $ref: '#/components/schemas/EvidenceRef'
          maxItems: 50
          type: array
        parentId:
          nullable: true
          type: string
        spec:
          type: string
        title:
          maxLength: 200
          minLength: 1
          type: string
      type: object
    Variable:
      additionalProperties: false
      properties:
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        deletedAt:
          format: date-time
          nullable: true
          type: string
        description:
          maxLength: 1024
          type: string
        id:
          $ref: '#/components/schemas/ID'
        name:
          $ref: '#/components/schemas/VariableName'
        type:
          $ref: '#/components/schemas/VariableType'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        value:
          $ref: '#/components/schemas/Scalar'
        valueVersion:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: Value version pinned by runs; changes only when the value changes.
        version:
          allOf:
            - $ref: '#/components/schemas/Version'
          description: Resource version (the ETag).
      required:
        - id
        - name
        - type
        - value
        - valueVersion
        - description
        - version
        - createdAt
        - updatedAt
        - deletedAt
      type: object
    VariableName:
      description: Immutable. Equal to the pipeline input name it supplies.
      pattern: ^[a-z][a-z0-9_-]{0,62}$
      type: string
    VariablePage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Variable'
          maxItems: 200
          type: array
        nextCursor:
          nullable: true
          type: string
      required:
        - items
        - nextCursor
      type: object
    VariableType:
      enum:
        - string
        - boolean
        - integer
      type: string
    Version:
      description: Resource version; the ETag is this integer in double quotes.
      format: int64
      maximum: 9007199254740991
      minimum: 1
      type: integer
    WorkItem:
      additionalProperties: false
      properties:
        acceptanceCriteria:
          items:
            $ref: '#/components/schemas/AcceptanceCriterion'
          maxItems: 100
          type: array
        assigneeId:
          nullable: true
          type: string
        blockedReason:
          maxLength: 2048
          nullable: true
          type: string
        completion:
          allOf:
            - $ref: '#/components/schemas/CompletionRecord'
          nullable: true
        contentRevision:
          $ref: '#/components/schemas/Version'
        createdAt:
          format: date-time
          type: string
        createdBy:
          $ref: '#/components/schemas/Actor'
        evidenceLinks:
          items:
            $ref: '#/components/schemas/EvidenceRef'
          maxItems: 50
          type: array
        id:
          $ref: '#/components/schemas/ID'
        kind:
          $ref: '#/components/schemas/WorkKind'
        parentId:
          nullable: true
          type: string
        reviewSubject:
          allOf:
            - $ref: '#/components/schemas/ReviewSubject'
          nullable: true
        spec:
          description: Specification Markdown (at most 65536 bytes). The plan is a section of it.
          type: string
        state:
          $ref: '#/components/schemas/WorkState'
        title:
          maxLength: 200
          minLength: 1
          type: string
        updatedAt:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/Version'
      required:
        - id
        - kind
        - title
        - spec
        - acceptanceCriteria
        - evidenceLinks
        - assigneeId
        - parentId
        - state
        - blockedReason
        - version
        - contentRevision
        - reviewSubject
        - completion
        - createdBy
        - createdAt
        - updatedAt
      type: object
    WorkItemPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/WorkItem'
          maxItems: 200
          type: array
        nextCursor:
          nullable: true
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
          type: string
      required:
        - items
        - nextCursor
      type: object
    WorkKind:
      enum:
        - epic
        - story
        - task
        - defect
      type: string
    WorkState:
      enum:
        - backlog
        - ready
        - active
        - review
        - done
        - cancelled
      type: string
    Workspace:
      additionalProperties: false
      properties:
        acceptedCommit:
          description: The last published or synchronized commit; null while provisioning.
          nullable: true
          pattern: ^([0-9a-f]{40}|[0-9a-f]{64})$
          type: string
        archiveRequestedAt:
          description: Set once admission is closed by an archive request.
          format: date-time
          nullable: true
          type: string
        branch:
          description: Portable ordinary work branch, refs/heads/kodama/work/<work-item-id>.
          pattern: ^refs/heads/[A-Za-z0-9][A-Za-z0-9_./-]*$
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$
          type: string
        lastError:
          description: Safe reason code (provision_unavailable, repository_unavailable, branch_exists, branch_diverged); never free text, a credential or repository content.
          nullable: true
          pattern: ^[a-z][a-z0-9_]{0,63}$
          type: string
        publication:
          $ref: '#/components/schemas/Publication'
        repositoryId:
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$
          type: string
        state:
          $ref: '#/components/schemas/WorkspaceState'
        updatedAt:
          format: date-time
          type: string
        version:
          $ref: '#/components/schemas/Version'
        workItemId:
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$
          type: string
        writerAttemptId:
          description: The attempt holding the single publication slot.
          nullable: true
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$
          type: string
      required:
        - id
        - workItemId
        - repositoryId
        - branch
        - acceptedCommit
        - state
        - writerAttemptId
        - publication
        - archiveRequestedAt
        - lastError
        - version
        - createdAt
        - updatedAt
      type: object
    WorkspaceState:
      description: Availability only. Errors are reasons on the resource (lastError), never states.
      enum:
        - provisioning
        - available
        - archived
      type: string
    Wrapper:
      additionalProperties: false
      properties:
        command:
          description: The exact wrapper entrypoint argv inside the image; compatibility evidence must cover it.
          items:
            maxLength: 512
            minLength: 1
            type: string
          maxItems: 16
          minItems: 1
          type: array
        harness:
          $ref: '#/components/schemas/Harness'
        id:
          pattern: ^[a-z][a-z0-9._-]{0,62}$
          type: string
        version:
          pattern: ^[0-9A-Za-z.+-]{1,64}$
          type: string
      required:
        - id
        - version
        - command
        - harness
      type: object
  securitySchemes:
    AgentsbearerAuth:
      $ref: '#/components/securitySchemes/bearerAuth'
    DeliverybearerAuth:
      $ref: '#/components/securitySchemes/bearerAuth'
    GatesbearerAuth:
      $ref: '#/components/securitySchemes/bearerAuth'
    LogsbearerAuth:
      $ref: '#/components/securitySchemes/bearerAuth'
    ObservationbearerAuth:
      $ref: '#/components/securitySchemes/bearerAuth'
    PipelinebearerAuth:
      $ref: '#/components/securitySchemes/bearerAuth'
    RunsbearerAuth:
      $ref: '#/components/securitySchemes/bearerAuth'
    WorkbearerAuth:
      $ref: '#/components/securitySchemes/bearerAuth'
    bearerAuth:
      description: Bearer access token. The authenticator is injected into the router; routes without verified identity are never served (deny by default).
      scheme: bearer
      type: http
    runtimeBearer:
      description: The attempt's runtime token with the `deployment.call` action. A token for another attempt, route, tenant or signing generation, or without that action, is refused.
      scheme: bearer
      type: http
