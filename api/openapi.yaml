                $ref: '#/components/schemas/ErrorEnvelope'
          description: The body is not one well-formed document of the contract's shape (invalid_request, with details.diagnostics), or another common request failure.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'definition_conflict: stored state contradicts the registration (for example a digest match with different content). A retry does not help; an operator must investigate.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "422":
          $ref: '#/components/responses/InvalidDefinition'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/Unavailable'
