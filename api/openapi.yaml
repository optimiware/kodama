      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DeliveryId'
  /tenants/{tenantId}/projects/{projectId}/chatops-deliveries/{id}/replay:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DeliveryId'
    post:
      description: 'Requires project:settings, `If-Match` (the delivery''s current version) and a reason. Only a `failed` delivery is replayed: a `delivered` one is final (422 `invalid_transition`) and a `pending` or `claimed` one is already moving. The replay starts a new retry cycle under the destination''s current binding, keeps the payload and the receiver idempotency key, preserves the complete attempt history and records an audit entry in the same transaction. A duplicate request finds the delivery at a newer version (412) or pending (422): one replay, one history.'
