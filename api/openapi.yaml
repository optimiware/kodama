            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: The body is not one well-formed profile of the contract's shape (invalid_request), or another common request failure.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          content:
