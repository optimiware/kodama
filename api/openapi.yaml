      - $ref: '#/components/parameters/ProjectId'
    post:
      description: Requires run:manage and an Idempotency-Key. The server authorizes the caller, resolves the registered definition, validates step kinds, input types and unknown inputs, pins the work item's specification at the stated content revision, verifies that the source commit belongs to the item's retained workspace history, pins the configuration and exact secret versions, and creates the run in one transaction with its history, audit and outbox events. The run is `queued`; it dispatches only after its run-bound source reference is confirmed, which the server retries until it succeeds. A body that differs under a used key is 409 idempotency_conflict; a lost response is recovered by repeating the request with the same key (the stored response is replayed after the caller's permission is checked again). Unknown fields are rejected.
      operationId: createRun
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              contentRevision: 2
              definitionId: pd_0123456789abcdef0123456789abcdef
              inputs:
                region: eu
              sourceCommit: "1111111111111111111111111111111111111111"
              workItemId: wi_1042
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                $ref: '#/components/examples/CreatedRun/value'
              schema:
                $ref: '#/components/schemas/Run'
          description: The run was created. The ETag is its version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Location:
              schema:
                type: string
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        "400":
