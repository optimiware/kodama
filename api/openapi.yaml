      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            examples:
              complete:
                summary: Human completion
                value:
                  completion:
                    acceptedCriteria:
                      - AC-1
                    acknowledgedFindings:
                      - id: F-7
                        summary: Export is slow
                    candidateCommit: "1111111111111111111111111111111111111111"
                    contentRevision: 2
                  reason: Accepted; F-7 is tracked separately.
                  to: done
              review:
                summary: Submit the candidate for review
                value:
                  review:
                    candidateCommit: "1111111111111111111111111111111111111111"
                    evidence:
                      - id: art_report_1
                        type: artifact
                  to: review
              start:
                summary: Start work
                value:
                  to: active
            schema:
              $ref: '#/components/schemas/TransitionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
