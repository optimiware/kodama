      description: |-
        Requires gate:decide for a human reviewer, an `If-Match` header with the gate version and an `Idempotency-Key`. The server derives the actor from the verified principal, then in one transaction rechecks the reviewer's current authority (also after any lock wait), the expected version, the subject digest, the deadline, any invalidation and the current content, candidate, definition, evidence and deployment (its identity, configuration, owning project and recorded candidate), applies the decision and commits it with its audit record, the gate.decided event and the stored response. Exactly one decision is ever recorded: of concurrent decisions one commits and the others get 412 version_conflict. A repeat with the same key and body replays the stored response after the caller's permission is checked again and records nothing; a different body under a used key is 409 idempotency_conflict. Unknown fields are rejected.

        Denials. 409 `stale_gate_subject`: the digest is not the gate's, the gate expired or was invalidated, or the current facts differ from the subject (details.reason names the first difference: content_changed, candidate_changed, definition_changed, evidence_changed, deployment_changed, step_not_waiting, work_cancelled, expired, invalidated, subject_digest_mismatch); the prior decision is unchanged and a definitive difference is recorded once as an invalidation. 412 `version_conflict`: stale If-Match. 428 `version_required`: no If-Match. 422 `invalid_transition`: the gate already has its decision. 422 conformance denials, for approval only: `conformance_missing`, `conformance_baseline_missing`, `conformance_evidence_invalid`, `conformance_malformed` and T-003's `conformance_candidate_mismatch`, `conformance_baseline_mismatch`, `conformance_incomplete` and `conformance_blocked` (these have no HTTP status in the runtime contract; this route maps them to 422). 403 `forbidden`: the caller is not a human reviewer of the project.
      operationId: decideGate
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            example:
              decision: approve
              reason: Reviewed the identified source and test evidence.
              subjectDigest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            schema:
              $ref: '#/components/schemas/GateDecisionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gate'
          description: The decision was recorded (or replayed). The ETag is the new gate version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: idempotency_conflict (the key was used with a different request) or stale_gate_subject (see the operation description; details.reason names why).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        "412":
          $ref: '#/components/responses/PreconditionFailed'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "415":
          $ref: '#/components/responses/UnsupportedMediaType'
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: invalid_transition (the gate is already decided) or a conformance denial of an approval (conformance_missing, conformance_baseline_missing, conformance_evidence_invalid, conformance_malformed, conformance_candidate_mismatch, conformance_baseline_mismatch, conformance_incomplete, conformance_blocked). Messages never echo evidence content.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        "428":
          $ref: '#/components/responses/PreconditionRequired'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/Unavailable'
      summary: Record the one immutable decision of a gate
