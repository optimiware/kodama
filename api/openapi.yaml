  /tenants/{tenantId}/projects/{projectId}/work-items/{id}/transitions:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkItemId'
    post:
      description: 'Checks the allowed edge, the caller''s permission for that edge, the expected version and every prerequisite inside one transaction. Entering active, including rework and reopening, is admitted under the project''s active work limit. Leaving active while a writer attempt is unsettled is 409 workspace_busy; cancel the run and retry after settlement. review to done is a human decision: the caller must be a person holding the completion permission, and the request names the observed content revision, candidate, accepted criteria and acknowledged findings. A passing run never completes work.'
