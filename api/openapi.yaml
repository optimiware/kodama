  headers:
    CacheControl:
      description: Always `no-store`; observation responses are never cached.
      schema:
        enum:
          - no-store
        type: string
    ETag:
      description: Quoted integer resource version.
      schema:
        $ref: '#/components/schemas/ETagValue'
    IdempotentReplayed:
      description: Present with the value true when the response is a stored replay of an earlier request.
      schema:
        enum:
          - "true"
        type: string
    Location:
      description: Absolute path of the created resource.
      schema:
        type: string
    RequestId:
      description: Server-generated identifier of this request, also present in error bodies.
      schema:
        pattern: ^req_[0-9a-f]{32}$
        type: string
    RetryAfter:
      description: Whole seconds, at least 1, after which the request may be retried.
      schema:
        minimum: 1
        type: integer
  parameters:
    ArtifactId:
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    AttemptId:
      in: path
      name: attemptId
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    Cursor:
      description: Opaque continuation token from a previous nextCursor. It is bound to the tenant, project, endpoint, filters and sort of the request that issued it and grants no permission; every page is authorized again.
      in: query
      name: cursor
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
    DefinitionId:
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    DeliveryId:
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    DependencyId:
      description: The prerequisite work item of the link.
      in: path
      name: dependencyId
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    DeploymentId:
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/DeploymentID'
    DestinationId:
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    EnvironmentId:
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    EventType:
      description: Repeatable event-type filter; repeated values are disjunctive. The set is normalized (sorted, deduplicated) and bound into the cursor. An unsupported type is 400 invalid_request, never ignored. Other query members are rejected.
      explode: true
      in: query
      name: type
      required: false
      schema:
        items:
          $ref: '#/components/schemas/ObservableEventType'
        type: array
      style: form
    GateId:
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    IdempotencyKey:
      description: Client-chosen key for run/deployment creation and gate decisions. The stored lookup key is (principal, tenant, method, canonical route, key); the request hash is stored and compared separately. A different request for the same key is 409 idempotency_conflict.
      in: header
      name: Idempotency-Key
      required: true
      schema:
        $ref: '#/components/schemas/IdempotencyKeyValue'
    IfMatch:
      description: Exactly one strong ETag equal to the quoted integer resource version, for example "7". Required for editable content, settings, transitions and decisions. Weak tags, the wildcard and comma-separated lists are rejected with 400 invalid_request. A missing header is 428 version_required and a stale version is 412 version_conflict.
      in: header
      name: If-Match
      required: true
      schema:
        $ref: '#/components/schemas/ETagValue'
    LastEventId:
      description: The `id` of the last frame received (an event or checkpoint cursor). Exactly one header value is accepted; only the event-stream representation resumes. A malformed, foreign or ahead-of-head cursor is 400 invalid_cursor; one older than the retained history is 410 cursor_expired.
      in: header
      name: Last-Event-ID
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
    Limit:
      description: Page size. Values outside 1..200 are rejected, never clamped.
      in: query
      name: limit
      required: false
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
    MembershipId:
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    ResourceId:
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    RunId:
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    TenantId:
      in: path
      name: tenantId
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    VersionNumber:
      description: Value version of the secret (not the resource version).
      in: path
      name: version
      required: true
      schema:
        format: int64
        maximum: 9007199254740991
        minimum: 1
        type: integer
    WorkDependenciesWorkItemId:
      description: The dependent work item, the one that waits.
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    WorkItemId:
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    WorkspaceId:
      description: Workspace identifier.
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    WorkspaceWorkItemId:
      description: Work item identifier.
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/ID'
  responses:
    ArchiveConflict:
      content:
        application/json:
          examples:
            archivePending:
              summary: Archive request recorded; a publication is still unsettled.
              value:
                error:
                  code: archive_pending
                  details:
                    publicationPending: true
                    state: available
                    version: 6
                    workspaceId: ws_01
                  message: archive settlement is not complete; the request is retained
                  requestId: req_00000000000000000000000000000002
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Conflict. archive_pending means admission is closed and the archive request is retained, but settlement is not proven yet; the new ETag is returned. Other codes are as for the other mutations.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Invalid request or invalid_cursor.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    ChatopsNameTaken:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: name_taken (the destination name is used in the project) or conflict.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    ChatopsNotConfigured:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: not_configured. The installation has no credential source for authenticated destinations; nothing was stored.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    ChatopsUnprocessable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: invalid_transition (the lifecycle forbids the change), destination_limit (the project has the maximum number of destinations), destination_refused (the installation's outbound policy refuses the endpoint) or credential_unavailable (the credential is missing, revoked, foreign or not bound to this recipient). Nothing was written.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Conflicting request, such as idempotency_conflict or a module-defined conflict.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    CursorExpired:
      content:
        application/json:
          example:
            error:
              code: cursor_expired
              details: {}
              message: the cursor is older than the retained history; fetch a snapshot and resume from its cursor
              requestId: req_0123456789abcdef0123456789abcdef
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: The cursor is older than the retained history (cursor_expired). Fetch the `application/json` snapshot and resume from its cursor.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    DeliveryUnprocessable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: invalid_transition (the lifecycle forbids the change), credential_unavailable (a credential reference is missing, foreign, revoked or not a kubeconfig where one is required) or image_provenance_rejected (the image is not a verified output of this source, producer and project). Nothing was written.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    DeploymentConflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: idempotency_conflict (a changed body under the same key); conflict (changed immutable inputs for an existing action, a different report for a settled outcome, or different intended objects); outcome_unknown (a new apply while the previous outcome is unknown, reconcile it first).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Authenticated but not permitted within the authorized scope (forbidden).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    InternalError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Unexpected failure with no internal detail (internal_error).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    InvalidDefinition:
      content:
        application/json:
          example:
            error:
              code: invalid_definition
              details:
                diagnostics:
                  - code: mutable_image
                    message: the image must be pinned by digest
                    path: spec.steps[0].image
                truncated: false
              message: the pipeline definition violates one or more rules
              requestId: req_00000000000000000000000000000001
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: 'invalid_definition: the document is well formed but violates a definition rule (graph, reference, type, source, capability or policy). details.diagnostics lists stable codes such as cycle, unknown_output, parallel_writers, conditional_gate, mutable_image and kind_disabled with their document paths.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    InvalidMcpServer:
      content:
        application/json:
          example:
            error:
              code: invalid_mcp_server
              details: {}
              message: the MCP server registration violates a rule
              requestId: req_00000000000000000000000000000001
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: 'invalid_mcp_server: the registration is well formed but violates a rule (endpoint shape, an endpoint outside the approved destinations, a credential reference that is missing, revoked, of another kind or of another project, tool names).'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    InvalidProfile:
      content:
        application/json:
          example:
            error:
              code: profile_unsupported
              details: {}
              message: the wrapper, harness and image combination has no compatibility evidence
              requestId: req_00000000000000000000000000000001
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: 'invalid_profile: the profile is well formed but violates a rule (field syntax, bounds, design baseline, unapproved model or tool; details.diagnostics lists stable codes such as invalid_field, limit_exceeded, unapproved_model and unapproved_tool with their paths), or profile_unsupported: the wrapper, harness and image combination or a claimed control has no compatibility evidence in this installation.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    NameTaken:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: name_taken (the environment name is used in the project) or another conflict.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    NotConfigured:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: not_configured. The installation has not configured this capability; nothing was done.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Not found, or hidden because the caller may not learn that it exists (not_found).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    Observation:
      content:
        application/json:
          examples:
            projectSnapshot:
              summary: Snapshot of a project with its resynchronization cursor
              value:
                cursor: AQAAAAAAAAAH.3q2kqzjXhYOq3uNBmK1U2xVZ-0RwPl8dY9M2zQe4mFg
                resources:
                  - id: wi_1042
                    kind: story
                    state: active
                    type: work_item
                    version: 7
                  - id: run_88
                    state: running
                    type: run
                    version: 3
                  - id: att_5
                    runId: run_88
                    state: running
                    stepId: build
                    type: step_attempt
                    version: 2
          schema:
            $ref: '#/components/schemas/Snapshot'
        text/event-stream:
          examples:
            resyncRequired:
              summary: Last frame when retention overtook the stream
              value: |
                event: resync_required
                data: {"code":"cursor_expired","message":"the position is older than the retained history; fetch a snapshot and resume from its cursor"}
            snapshotThenEvents:
              summary: Fresh stream, then one event, then a checkpoint
              value: |
                event: snapshot
                id: AQAAAAAAAAAH.3q2kqzjXhYOq3uNBmK1U2xVZ-0RwPl8dY9M2zQe4mFg
                data: {"cursor":"AQAAAAAAAAAH.3q2kqzjXhYOq3uNBmK1U2xVZ-0RwPl8dY9M2zQe4mFg","resources":[{"type":"work_item","id":"wi_1042","version":7,"state":"active","kind":"story"}]}

                event: work_item.transitioned
                id: AQAAAAAAAAAI.0b7Yw9r2n5Qx1kPzLdTq8uVhJc3sEaM6fWoN4yRgIt
                data: {"id":"evt_01","schemaVersion":1,"type":"work_item.transitioned","occurredAt":"2026-10-19T10:05:00Z","tenantId":"t_acme","projectId":"p_inventory","resource":{"type":"work_item","id":"wi_1042","version":8},"actor":{"type":"user","id":"usr_engineer"},"correlationId":"req_01","causationId":null,"data":{"from":"active","to":"review","transitionId":"tr_01"}}

                event: checkpoint
                id: AQAAAAAAAAAK.8mTz1QvB5nXc2oLr7yUe4sKpJa9dHgWfI6tNqRxYbVk
                data: {"cursor":"AQAAAAAAAAAK.8mTz1QvB5nXc2oLr7yUe4sKpJa9dHgWfI6tNqRxYbVk"}

                : heartbeat
          schema:
            description: 'Server-sent events. `data` of each frame is one line of JSON: Snapshot for `snapshot`, ObservedEvent for event frames, Checkpoint for `checkpoint`, ResyncRequired for `resync_required`.'
            type: string
      description: The event stream (`text/event-stream`) or a snapshot with its cursor (`application/json`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    ObservationUnavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: A required dependency is unavailable (unavailable), or the complete snapshot exceeds the configured bound (snapshot_too_large; no cursor is issued and nothing is truncated).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    PayloadTooLarge:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Request body exceeds the configured bound (invalid_request).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    PreconditionFailed:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Stale If-Match version (version_conflict).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    PreconditionRequired:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Required If-Match header is missing (version_required).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    RuntimeForbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: forbidden (the action is not granted, or the caller is not bound to this deployment), pin_required (the attempt's pinned context or retained configuration is absent, foreign or mismatched; there is no fallback to current settings) or attempt_revoked (the attempt no longer holds authority; no replay exception applies).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    TooManyRequests:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Scoped rate limit exceeded (rate_limited).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Missing or invalid credential (invalid_credential).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    Unavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: A required dependency is unavailable, or an outcome is unknown and the same request may be retried (unavailable).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    Unprocessable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: invalid_transition (the edge or the item's state forbids it) or prerequisite_unmet (a reason, specification, evidence, acknowledgment or dependency is missing).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    UnsupportedMediaType:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: Request body is not application/json (invalid_request).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    WorkDependenciesUnprocessable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: dependency_cycle (the link would make a work item depend on itself or exceed the bound on prerequisites) or invalid_transition (a done or cancelled work item accepts no link changes).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    Workspace:
      content:
        application/json:
          examples:
            available:
              value:
                acceptedCommit: "1111111111111111111111111111111111111111"
                archiveRequestedAt: null
                branch: refs/heads/kodama/work/wi_1042
                createdAt: "2026-10-19T10:00:00Z"
                id: ws_01
                lastError: null
                publication: null
                repositoryId: repo_1
                state: available
                updatedAt: "2026-10-19T10:05:00Z"
                version: 4
                workItemId: wi_1042
                writerAttemptId: null
          schema:
            $ref: '#/components/schemas/Workspace'
      description: The workspace resource.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
    WorkspaceConflict:
      content:
        application/json:
          examples:
            diverged:
              summary: The remote branch was rewritten; nothing was adopted.
              value:
                error:
                  code: branch_diverged
                  details:
                    lastError: branch_diverged
                  message: the remote branch is not a fast-forward of the accepted commit
                  requestId: req_00000000000000000000000000000001
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      description: 'Conflict. Codes: work_item_not_actionable, workspace_state_conflict, publication_pending, branch_diverged, publisher_fenced.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
  schemas:
    AcceptanceCriterion:
      additionalProperties: false
      properties:
        id:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
          type: string
        text:
          maxLength: 2000
          minLength: 1
          type: string
      required:
        - id
        - text
      type: object
    ActionKey:
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
      type: string
    Actor:
      additionalProperties: false
      properties:
        id:
          maxLength: 256
          minLength: 1
          type: string
        type:
          $ref: '#/components/schemas/ActorType'
      required:
        - type
        - id
      type: object
    ActorType:
      enum:
        - user
        - service
        - workload
        - operator
      type: string
    AddDependency:
      additionalProperties: false
      properties:
        dependencyId:
          $ref: '#/components/schemas/ID'
      required:
        - dependencyId
      type: object
    AgentProfile:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        createdBy:
          $ref: '#/components/schemas/Actor'
        digest:
          $ref: '#/components/schemas/Digest'
        id:
          $ref: '#/components/schemas/ID'
        name:
          $ref: '#/components/schemas/ProfileName'
        profile:
          $ref: '#/components/schemas/CanonicalProfile'
        reference:
          description: The immutable reference `name@version` a pipeline agent step uses.
          pattern: ^[a-z][a-z0-9_-]{0,62}@[1-9][0-9]{0,15}$
          type: string
        version:
          $ref: '#/components/schemas/Version'
      required:
        - id
        - name
        - version
        - reference
        - digest
        - profile
        - createdBy
        - createdAt
      type: object
    AgentProfileDraft:
      additionalProperties: false
      properties:
        designBaseline:
          $ref: '#/components/schemas/DesignBaseline'
        image:
          description: The harness image, pinned by digest.
          maxLength: 512
          pattern: ^[^\s@]+@sha256:[0-9a-f]{64}$
          type: string
        instructions:
          maxLength: 65536
          minLength: 1
          type: string
        limits:
          $ref: '#/components/schemas/Limits'
        model:
          $ref: '#/components/schemas/Model'
        name:
          $ref: '#/components/schemas/ProfileName'
        tools:
          items:
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,127}$
            type: string
          maxItems: 128
          type: array
        transcript:
          $ref: '#/components/schemas/Transcript'
        wrapper:
          $ref: '#/components/schemas/Wrapper'
      required:
        - name
        - image
        - wrapper
        - instructions
        - designBaseline
        - model
        - tools
        - limits
        - transcript
      type: object
    AgentProfilePage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AgentProfile'
          maxItems: 200
          type: array
        nextCursor:
          nullable: true
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
          type: string
      required:
        - items
        - nextCursor
      type: object
    Applicability:
      additionalProperties: false
      description: Derived at read time from the gate record alone (status, deadline, invalidation, conformance). The decision and progression additionally recheck current facts.
      properties:
        applicable:
          description: True only for an approved, unexpired, uninvalidated gate whose conformance evidence is acceptable.
          type: boolean
        expired:
          type: boolean
        reason:
          nullable: true
          type: string
      required:
        - expired
        - applicable
        - reason
      type: object
    Artifact:
      additionalProperties: false
      properties:
        attemptId:
          $ref: '#/components/schemas/ID'
          description: The producing attempt.
        availability:
          $ref: '#/components/schemas/ArtifactAvailability'
        createdAt:
          format: date-time
          type: string
        digest:
          $ref: '#/components/schemas/Digest'
        download:
          allOf:
            - $ref: '#/components/schemas/ArtifactDownload'
          nullable: true
        id:
          $ref: '#/components/schemas/ID'
        kind:
          $ref: '#/components/schemas/ArtifactKind'
        mediaType:
          description: Files only.
          nullable: true
          type: string
        name:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
          type: string
        registry:
          description: OCI only. The canonical registry/repository, without tag or digest.
          nullable: true
          type: string
        role:
          $ref: '#/components/schemas/ArtifactRole'
        runId:
          $ref: '#/components/schemas/ID'
        sizeBytes:
          description: The declared size of a file, or the verified manifest size of a registration.
          format: int64
          maximum: 1099511627776
          minimum: 0
          nullable: true
          type: integer
        source:
          allOf:
            - $ref: '#/components/schemas/SourceProvenance'
          nullable: true
        state:
          $ref: '#/components/schemas/ArtifactState'
        stepId:
          maxLength: 128
          minLength: 1
          type: string
        verifiedAt:
          format: date-time
          nullable: true
          type: string
        version:
          $ref: '#/components/schemas/Version'
      required:
        - id
        - attemptId
        - runId
        - stepId
        - name
        - kind
        - role
        - state
        - availability
        - digest
        - mediaType
        - sizeBytes
        - registry
        - source
        - version
        - createdAt
        - verifiedAt
        - download
      type: object
    ArtifactAvailability:
      description: 'Local content bookkeeping, separate from state. abandoned: a reservation that was never completed and was cleaned up. removed: content deleted under a retention policy (metadata and provenance remain). Registry content is never removed by Kodama.'
      enum:
        - available
        - abandoned
        - removed
      type: string
    ArtifactDownload:
      additionalProperties: false
      description: Short-lived transfer instruction. It is a bearer capability, so do not log or store it.
      properties:
        expiresAt:
          format: date-time
          type: string
        method:
          enum:
            - GET
          type: string
        url:
          pattern: ^https?://[^\s]+$
          type: string
      required:
        - method
        - url
        - expiresAt
      type: object
    ArtifactKind:
      description: A file kept by Kodama, or a verified registration of content in an OCI registry.
      enum:
        - file
        - oci
      type: string
    ArtifactRole:
      enum:
        - output
        - diagnostic
        - bundle
      type: string
    ArtifactState:
      description: 'reserved: a file whose bytes are not verified (never usable). registered: an OCI registration verified against its registry. usable: a file whose bytes were verified and sealed.'
      enum:
        - reserved
        - registered
        - usable
      type: string
    Attempt:
      additionalProperties: false
      description: One attempt. Its reason is starting while the Job does not exist yet, and outcome_unknown for an ambiguous failure that cannot be retried until its effects are reconciled. A terminal outcome is never rewritten.
      properties:
        access:
          enum:
            - none
            - read
            - write
          type: string
        createdAt:
          format: date-time
          type: string
        diagnosticArtifactIds:
          items:
            $ref: '#/components/schemas/ID'
          type: array
        executionDeadlineAt:
          format: date-time
          nullable: true
          type: string
        failureClass:
          enum:
            - infrastructure
            - transient
            - command
            - validation
            - policy
            - timeout
            - cancelled
            - null
          nullable: true
          type: string
        finishedAt:
          format: date-time
          nullable: true
          type: string
        id:
          $ref: '#/components/schemas/ID'
        inputCommit:
          nullable: true
          type: string
        jobName:
          type: string
        observedJobUid:
          nullable: true
          type: string
        ordinal:
          minimum: 1
          type: integer
        reason:
          $ref: '#/components/schemas/Reason'
        resultHash:
          nullable: true
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        settled:
          description: True when the attempt's effects are accounted for; a terminal run requires every attempt settled.
          type: boolean
        startedAt:
          format: date-time
          nullable: true
          type: string
        startupDeadlineAt:
          format: date-time
          type: string
        status:
          $ref: '#/components/schemas/AttemptStatus'
      required:
        - id
        - ordinal
        - status
        - reason
        - failureClass
        - jobName
        - observedJobUid
        - access
        - inputCommit
        - startupDeadlineAt
        - executionDeadlineAt
        - startedAt
        - finishedAt
        - resultHash
        - diagnosticArtifactIds
        - settled
        - createdAt
      type: object
    AttemptResult:
      description: in_flight is an attempt whose outcome has not been recorded yet.
      enum:
        - in_flight
        - delivered
        - retry
        - failed
        - abandoned
      type: string
    AttemptStatus:
      enum:
        - running
        - succeeded
        - failed
        - cancelled
      type: string
    BindingGrant:
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/Role'
        userId:
          $ref: '#/components/schemas/ID'
      required:
        - userId
        - role
      type: object
    CanonicalDefinition:
      additionalProperties: true
      description: The canonical form of the registered document (sorted keys, documented defaults applied, integers preserved). Its SHA-256 is the digest.
      type: object
    CanonicalProfile:
      additionalProperties: true
      description: The canonical form of the registered profile (sorted keys, tools and baseline in canonical order, integers preserved). Its SHA-256 is the digest.
      type: object
    ChatopsAttempt:
      additionalProperties: false
      properties:
        class:
          $ref: '#/components/schemas/FailureClass'
        finishedAt:
          format: date-time
          type: string
        httpStatus:
          maximum: 599
          minimum: 100
          type: integer
        number:
          minimum: 1
          type: integer
        receipt:
          $ref: '#/components/schemas/Receipt'
        replay:
          description: The retry cycle the attempt belongs to; 0 before any replay.
          minimum: 0
          type: integer
        result:
          $ref: '#/components/schemas/AttemptResult'
        startedAt:
          format: date-time
          type: string
        uncertain:
          type: boolean
      required:
        - number
        - result
        - uncertain
        - replay
        - startedAt
      type: object
    ChatopsEventType:
      description: The explicit allow-list a destination selects from; nothing else is ever forwarded.
      enum:
        - work_item.transitioned
        - gate.requested
        - gate.decided
        - gate.invalidated
        - run.state_changed
        - deployment.state_changed
      type: string
    Checkpoint:
      additionalProperties: false
      properties:
        cursor:
          $ref: '#/components/schemas/Cursor'
      required:
        - cursor
      type: object
    ChildSummary:
      additionalProperties: false
      properties:
        cancelled:
          minimum: 0
          type: integer
        done:
          minimum: 0
          type: integer
        total:
          minimum: 0
          type: integer
      required:
        - total
        - done
        - cancelled
      type: object
    Cleanup:
      additionalProperties: false
      properties:
        reason:
          pattern: ^[a-z][a-z0-9_]{0,63}$
          type: string
        requestedAt:
          format: date-time
          type: string
        state:
          $ref: '#/components/schemas/CleanupState'
      required:
        - state
      type: object
    CleanupReport:
      additionalProperties: false
      properties:
        deleted:
          description: Owned objects confirmed absent. `done` lists every owned object.
          items:
            $ref: '#/components/schemas/ObjectRef'
          maxItems: 64
          type: array
        reason:
          description: Required for `failed` and `unknown`.
          pattern: ^[a-z][a-z0-9_]{0,63}$
          type: string
        state:
          enum:
            - done
            - failed
            - unknown
          type: string
      required:
        - state
      type: object
    CleanupState:
      enum:
        - none
        - requested
        - failed
        - unknown
        - done
      type: string
    Commit:
      description: Full Git object name.
      pattern: ^([0-9a-f]{40}|[0-9a-f]{64})$
      type: string
    CompletionClaim:
      additionalProperties: false
      properties:
        acceptedCriteria:
          items:
            type: string
          maxItems: 100
          type: array
        acknowledgedFindings:
          items:
            $ref: '#/components/schemas/Finding'
          maxItems: 50
          type: array
        candidateCommit:
          pattern: ^([0-9a-f]{40}|[0-9a-f]{64})$
          type: string
        contentRevision:
          format: int64
          maximum: 9007199254740991
          minimum: 1
          type: integer
      required:
        - contentRevision
        - acceptedCriteria
      type: object
    CompletionRecord:
      additionalProperties: false
      properties:
        acceptedCriteria:
          items:
            type: string
          maxItems: 100
          type: array
        acknowledgedFindings:
          items:
            $ref: '#/components/schemas/Finding'
          maxItems: 50
          type: array
        candidateCommit:
          type: string
        childSummary:
          $ref: '#/components/schemas/ChildSummary'
        completedAt:
          format: date-time
          type: string
        completedBy:
          $ref: '#/components/schemas/Actor'
        contentRevision:
          format: int64
          maximum: 9007199254740991
          minimum: 1
          type: integer
        reason:
          maxLength: 2048
          type: string
      required:
        - completedBy
        - completedAt
        - contentRevision
        - acceptedCriteria
      type: object
    Conformance:
      additionalProperties: false
      description: Present only for an agent-produced candidate. A `blocked` snapshot refuses approval and carries the denial code; the report stays bound to the subject for review.
      nullable: true
      properties:
        baselineDigest:
          nullable: true
          type: string
        code:
          nullable: true
          type: string
        producerStep:
          type: string
        reportDigest:
          nullable: true
          type: string
        reportId:
          nullable: true
          type: string
        requiredChecks:
          items:
            type: string
          type: array
        status:
          enum:
            - verified
            - blocked
          type: string
      required:
        - status
        - code
        - producerStep
        - baselineDigest
        - requiredChecks
        - reportId
        - reportDigest
      type: object
    ConsumerHandlingSummary:
      additionalProperties: false
      description: External effects owed to known consumers of the revoked version. Pending effects are tracked until their owners acknowledge them; their existence does not claim that delivered bytes were recalled.
      properties:
        pending:
          minimum: 0
          type: integer
        total:
          minimum: 0
          type: integer
      required:
        - total
        - pending
      type: object
    CreateMembership:
      additionalProperties: false
      properties:
        projectId:
          $ref: '#/components/schemas/ID'
        role:
          $ref: '#/components/schemas/Role'
        userId:
          $ref: '#/components/schemas/ID'
      required:
        - userId
        - role
      type: object
    CreateProject:
      additionalProperties: false
      properties:
        activeWipLimit:
          description: Defaults to 5.
          maximum: 100000
          minimum: 1
          type: integer
        displayName:
          maxLength: 256
          type: string
        key:
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$
          type: string
        settings:
          additionalProperties: true
          type: object
      required:
        - key
      type: object
    CreateRunRequest:
      additionalProperties: false
      properties:
        contentRevision:
          format: int64
          maximum: 9007199254740991
          minimum: 1
          type: integer
        definitionId:
          $ref: '#/components/schemas/ID'
        inputs:
          additionalProperties:
            $ref: '#/components/schemas/RunsScalar'
          description: Run inputs by declared name. Unknown names and type mismatches are admission_refused. Precedence is default, then project variable, then this value.
          maxProperties: 100
          type: object
        sourceCommit:
          pattern: ^([0-9a-f]{40}|[0-9a-f]{64})$
          type: string
        workItemId:
          $ref: '#/components/schemas/ID'
      required:
        - workItemId
        - definitionId
        - contentRevision
        - sourceCommit
      type: object
    CreateSecretRequest:
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/SecretKind'
        name:
          $ref: '#/components/schemas/SecretName'
        value:
          description: Base64 (standard alphabet, padded) of 1 to 131072 bytes. Write-only; never returned.
          format: byte
          maxLength: 174768
          minLength: 4
          type: string
          writeOnly: true
      required:
        - name
        - kind
        - value
      type: object
    CreateSecretVersionRequest:
      additionalProperties: false
      properties:
        value:
          description: Base64 (standard alphabet, padded) of 1 to 131072 bytes. Write-only; never returned.
          format: byte
          maxLength: 174768
          minLength: 4
          type: string
          writeOnly: true
      required:
        - value
      type: object
    CreateVariableRequest:
      additionalProperties: false
      properties:
        description:
          maxLength: 1024
          type: string
        name:
          $ref: '#/components/schemas/VariableName'
        value:
          $ref: '#/components/schemas/Scalar'
      required:
        - name
        - value
      type: object
    CreateWorkItem:
      additionalProperties: false
      properties:
        acceptanceCriteria:
          items:
            $ref: '#/components/schemas/AcceptanceCriterion'
          maxItems: 100
          type: array
        assigneeId:
          type: string
        evidenceLinks:
          items:
            $ref: '#/components/schemas/EvidenceRef'
          maxItems: 50
          type: array
        kind:
          $ref: '#/components/schemas/WorkKind'
        parentId:
          type: string
        spec:
          type: string
        title:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - kind
        - title
      type: object
    CredentialBinding:
      additionalProperties: false
      properties:
        delivery:
          $ref: '#/components/schemas/SecretDelivery'
        name:
          description: The file or environment name the script receives the value under.
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
          type: string
        ref:
          description: A project secret reference. A value or version is never part of the definition.
          pattern: ^secret://project/[a-z][a-z0-9-]{0,62}$
          type: string
      required:
        - name
        - ref
        - delivery
      type: object
    CredentialRef:
      additionalProperties: false
      description: 'An exact typed secret reference: the name of an MCP-kind project secret and one exact value version. There is no "current" alias, so a rotation cannot change what a run resolves. The value is never returned by any route.'
      properties:
        name:
          pattern: ^[a-z][a-z0-9-]{0,62}$
          type: string
        version:
          $ref: '#/components/schemas/Version'
      required:
        - name
        - version
      type: object
    CredentialReference:
      additionalProperties: false
      properties:
        ref:
          description: A project secret of kind `model`.
          pattern: ^secret://project/[a-z][a-z0-9-]{0,62}$
          type: string
        version:
          description: The exact secret value version. The gateway never substitutes a newer version; moving the pin is a settings change that affects later runs.
          format: int64
          maximum: 9007199254740991
          minimum: 1
          type: integer
      required:
        - ref
        - version
      type: object
    Cursor:
      description: Opaque, authenticated continuation token.
      maxLength: 2048
      minLength: 1
      pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
      type: string
    Decision:
      additionalProperties: false
      nullable: true
      properties:
        decidedAt:
          $ref: '#/components/schemas/GatesTimestamp'
        decidedBy:
          $ref: '#/components/schemas/GatesActor'
        decision:
          enum:
            - approve
            - reject
          type: string
        reason:
          maxLength: 2048
          minLength: 1
          type: string
      required:
        - decidedBy
        - decision
        - reason
        - decidedAt
      type: object
    DeleteSecretResult:
      additionalProperties: false
      properties:
        retention:
          $ref: '#/components/schemas/RetentionReport'
        secret:
          $ref: '#/components/schemas/Secret'
      required:
        - secret
        - retention
      type: object
    Delivery:
      additionalProperties: false
      properties:
        attempts:
          description: Total attempts over the delivery's life, replays included.
          minimum: 0
