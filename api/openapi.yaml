    ModelLimits:
      additionalProperties: false
      properties:
        maxInputTokens:
          description: Bound of the conservative input-token estimate of one request.
          format: int64
          maximum: 4000000
          minimum: 1
          type: integer
        maxOutputTokens:
          description: Bound of the output tokens one request may ask for; sent to the provider as the enforced limit.
          format: int64
          maximum: 1000000
          minimum: 1
          type: integer
        maxRequestBytes:
          format: int64
          maximum: 4194304
          minimum: 1
          type: integer
        maxRequests:
          description: Requests one run may admit, counted atomically at admission.
          format: int64
          maximum: 100000
          minimum: 1
          type: integer
        tokenAllowance:
          description: New requests are admitted only while charged tokens are below this allowance. Charged tokens are the provider's observed usage or, when usage is missing, invalid or uncertain, the request bound. At most one request is unresolved per run, so charged tokens stay below `tokenAllowance - 1 + maxInputTokens + maxOutputTokens`. This is a token-overshoot bound for charges within the verified provider/input/output bounds, used for operational admission; it is not a monetary guarantee, price or entitlement (Platform owns those). Usage a provider reports above those bounds fails the request as `bound_exceeded` and is recorded unclamped.
