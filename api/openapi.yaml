  /tenants/{tenantId}/projects/{projectId}/model-settings:
    get:
      description: 'Requires `config:read`. A project that never stored settings has the virtual, disabled revision 1 (`stored: false`), so a first PUT carries `If-Match: "1"` and no wildcard creation semantics exist. The first stored revision is 2. The response never contains a credential value.'
      operationId: getModelSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSettings'
          description: The current settings.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      summary: Read the project's model settings
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProjectId'
    put:
      description: 'Requires `project:settings`, rechecked inside the write transaction, and If-Match (the ETag as last read). Replaces the whole representation. An edit that changes nothing and carries the current revision returns that revision unchanged. Replaying a successful update with its old If-Match receives a precondition failure: reread the settings to learn whether the update landed. Each change appends an immutable revision, an audit entry and a `project.settings_changed` event. The endpoint must be an installation-approved destination, the credential a `model` secret of this project at an existing, unrevoked exact version, and `recording` may only be enabled when the installation has a content recorder. A run''s policy is bound, together with its exact credential version pin, atomically at that run''s first model admission; a run keeps that binding afterwards, so a change affects runs whose first model admission comes later (a run that has not yet made a model request uses the settings current at its first one), except that disabling the project or recording takes effect on the next request of every run. This management response contains settings and the secret reference, never a credential value.'
      operationId: replaceModelSettings
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceModelSettingsRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSettings'
          description: The stored settings (unchanged when the edit changed nothing).
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        "400":
