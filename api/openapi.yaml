        Requires deployment:manage and `Idempotency-Key`. The body names an existing originating attempt, the candidate source and the image. The environment, its immutable configuration pin, the run, step and action key come from that attempt's pinned context and its retained configuration snapshot; current environment settings, manifests and credential values are never accepted. The image must be a usable OCI output of a succeeded producer, a pinned input of the attempt, and of exactly the stated source (`image_provenance_rejected`, 422, otherwise).
