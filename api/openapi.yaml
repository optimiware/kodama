    post:
      description: 'Idempotent by work-item ownership, so no Idempotency-Key is required: the first call reserves the workspace, then creates the branch with an expected-absent update; repeating the call returns the same workspace. The workspace itself is returned, never an operation handle. 201 is a newly created available workspace, 200 an existing one, and 202 a workspace that is still provisioning (lastError carries the safe reason; repeat the request to retry). An epic has no workspace (409 work_item_not_actionable); a foreign or missing work item is 404.'
