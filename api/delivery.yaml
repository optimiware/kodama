    OutcomeSucceeded:
      value:
        state: succeeded
        objects:
          - {apiVersion: apps/v1, kind: Deployment, namespace: t035-preview, name: inventory, uid: '00000000-0000-4000-8000-000000000001', ready: true}
    CleanupDone:
      value:
        state: done
        deleted:
          - {apiVersion: apps/v1, kind: Deployment, namespace: t035-preview, name: inventory, uid: '00000000-0000-4000-8000-000000000001'}
