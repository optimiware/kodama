openapi: 3.0.3
info:
  title: Kodama Git credential exchange
  version: 1.0.0
  description: >-
    Exchange of a verified login for a short-lived Git credential of the internal Git service
    (docs/contracts/git-service.md, "Git credentials and grants"; docs/specs/git-repositories.md
    GR-05, GR-06, GR-18; docs/specs/identity-tenancy-and-rbac.md IT-18). Owned by T-136. Shared
    conventions (error envelope, request identifier) come from api/common.yaml. The Go contract
    is contracts/git/v1; the types are generated into internal/gitauth/http/gitcredentials.gen.go
    (see internal/gitauth/http/generate.go). Routes are relative to /api/v1. This fragment is not
    part of the published aggregate until the Git API task (T-158) lists it.


    The credential is an opaque secret, returned once and stored only as a hash. It names exactly
    one project and repository, the pair the `kodama git credential` helper derives from the clone
    URL path (`git config credential.useHttpPath true`). The caller is the verified person of the
    access token; the body never names a user. A person's current project roles are checked
    again at every Git request, so the credential carries no frozen permission: an engineer may
    push within the repository's ref policy, any other reading role may only fetch, and a removed
    role takes effect on the next request even while the credential is unexpired. With
    `seed: true` the credential is the single-use seed grant of an empty repository
    (docs/specs/git-repositories.md, "Bootstrap by push").
paths:
  /tenants/{tenantId}/git-credentials:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: exchangeGitCredential
      summary: Exchange the caller's access token for a Git credential
      description: >-
        Issues a human credential (`seed: false`) for reading the repository, and pushing it where
        the caller's role allows, or the seed credential (`seed: true`) that permits exactly one
        receive whose only update creates the repository's default branch. The response is never
        cached and the credential is never returned a second time; a new exchange issues a new
        one (a new seed credential revokes the repository's earlier unused seed credential).
        The caller needs read access to the project (`403 forbidden` otherwise; `404 not_found`
        when no role reaches it or the repository is foreign or unknown) and, for a seed, the
        `engineer` role. A seed is refused with `409 repository_not_empty` when the repository has
        any ref, `409 seed_pending` while it has any unsettled push record of any kind,
        `409 repository_not_ready`, `409 repository_archived` and `422 hosting_mismatch` for an
        externally hosted repository. Requests are rate limited per caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitCredentialRequest'
            example:
              projectId: p_inventory
              repositoryId: repo_01
              seed: false
      responses:
        '200':
          description: The credential. Shown once.
          headers:
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitCredential'
              example:
                username: kodama
                password: gitc_EXAMPLE_PLACEHOLDER_NOT_A_CREDENTIAL_0123456
                grantId: gg_0f3a5c9e1b7d4a6e8c2b4d6f8a0c2e4a
                expiresAt: '2026-10-30T10:15:00Z'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: >-
            `repository_not_empty`, `seed_pending`, `repository_not_ready` or
            `repository_archived`.
          headers:
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: seed_pending
                  message: an earlier push is unsettled
                  requestId: req_0f3a5c9e1b7d4a6e8c2b4d6f8a0c2e4a
                  details: {}
        '413':
          $ref: 'common.yaml#/components/responses/PayloadTooLarge'
        '415':
          $ref: 'common.yaml#/components/responses/UnsupportedMediaType'
        '422':
          description: '`hosting_mismatch`: the repository is not hosted by Kodama.'
          headers:
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/ErrorEnvelope'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
components:
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        $ref: 'common.yaml#/components/schemas/ID'
  schemas:
    GitCredentialRequest:
      type: object
      additionalProperties: false
      required: [projectId, repositoryId, seed]
      description: >-
        All three members are required; `seed` is an explicit boolean, never defaulted. The
        credential is for exactly this project and repository.
      properties:
        projectId:
          $ref: 'common.yaml#/components/schemas/ID'
        repositoryId:
          $ref: 'common.yaml#/components/schemas/ID'
        seed:
          type: boolean
          description: >-
            False for an ordinary human credential, true for the single-use seed credential of an
            empty repository.
    GitCredential:
      type: object
      required: [username, password, grantId, expiresAt]
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
          description: Conventional only; any username is accepted at use.
        password:
          type: string
          pattern: '^[A-Za-z0-9._~+/=-]{16,1000}$'
          description: >-
            The opaque credential: HTTP Basic password, or a bearer token. Shown once and stored
            only as a hash; never log it.
        grantId:
          $ref: 'common.yaml#/components/schemas/ID'
        expiresAt:
          type: string
          format: date-time
          description: >-
            At most one hour for a human credential and 15 minutes for a seed credential after
            issue.
