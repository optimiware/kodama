openapi: 3.0.3
info:
  title: Kodama native Git triggers and task route HTTP fragment
  version: 1.0.0
  description: >-
    Configuration of the pipelines that start from the internal Git service (docs/specs/git-repositories.md,
    "Triggers"; docs/contracts/git-service.md, "Trigger configuration"; docs/specs/pipeline-execution.md
    PX-24; ADR 0011). Owned by T-137; the Go use cases are internal/integrations/gitwebhook
    (`NativeConfig`). Shared conventions (error envelope, request identifier, pagination, `If-Match`) come from
    api/common.yaml. This fragment is not part of the published aggregate until the Git API task (T-158) lists it,
    and it does not change the external receive-hook endpoint (api/git-webhooks.yaml), which stays as it is.

    **Status.** This fragment describes the configurable-trigger design (`internal/integrations/gitwebhook`
    `NativeConfig`), which the kernel assembly does not serve. The kernel starts runs from the pipeline document's own
    `triggers.git` instead (docs/contracts/git-service.md, "Trigger configuration" and "Indexing"; internal/kernel/dispatch):
    there is no trigger resource, route or `configuredBy`, and the event's inline `updates` are matched directly.

    `P` is `/tenants/{tenantId}/projects/{projectId}`.

    ## Triggers

    A trigger selects one internally hosted repository, one to 32 ref patterns (the grant syntax: a full
    ref name under `refs/heads/` or `refs/tags/` with an optional trailing `/*` after at least one component;
    `refs/heads/*`, an inner wildcard and anything under `refs/kodama/` are not patterns), whether a push made by a run is
    excluded (`excludeOriginRuns`, default `true`), the pipeline definition to start and whether it is
    enabled. The Git service emits one `git.refs_updated` event per applied receive, carrying its applied
    updates inline (`receiveId`, `originRunId`, `updates` of `{ref, old, new, kind}`); the consumer skips a
    run-originated push from the event alone when the trigger excludes origin runs, reloads the push record of the
    event's `receiveId` as the authority on the entries, and starts at most one run per `(trigger, push record, ref)`: the run pins the `new`
    commit of that applied entry, never the branch tip, never a delete or a refused entry, and has no work item. A
    redelivered event, a restart or a second consumer returns the same run (a stable run identity derived from the
    key); a refusal by run admission is decided once and recorded.

    ## Authority

    Creating and altering a trigger (including disabling it) needs the project settings authority; reading needs
    the project read role. Every call is authorized against the current state. A foreign or unknown project,
    repository, trigger or definition is the same `404 not_found`. The principal who created or last altered a trigger
    is recorded as `configuredBy`: run admission checks *that principal's current run authority* on every start, so a
    trigger never carries authority of its own and a revoked configurer stops it from starting runs. There is no
    delete: a trigger is disabled, so the keys it already decided stay explainable.

    ## Task route

    A project has at most one task route: the pipeline definition admitted as a `work_item` run when a work item
    becomes ready (`work_item.transitioned` to `ready`, or `work_item.created` in `ready`). Admission re-reads the item
    and starts nothing for an item that is no longer ready, blocked, cancelled or not actionable (a recorded decision), and
    otherwise goes through the same source-set admission as every other origin, so current authority (`configuredBy`),
    quotas, cancellation and idempotency are admission's. The key is the readiness transition: leaving and re-entering
    `ready` is a new run, a redelivery of one transition is a replay. Business WIP stays the work module's rule on the
    `ready` to `active` edge; the route never bypasses it.
servers:
  - url: https://factory.example.invalid/api/v1
security:
  - bearerAuth: []
paths:
  /tenants/{tenantId}/projects/{projectId}/git-triggers:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listGitTriggers
      summary: List the project's native Git triggers
      description: Ordered by identifier. A cursor is bound to the tenant, project, endpoint and ordering, and every page is authorized again.
      parameters:
        - $ref: 'common.yaml#/components/parameters/Limit'
        - $ref: 'common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of triggers.
          headers:
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitTriggerList'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
    post:
      operationId: createGitTrigger
      summary: Create a trigger
      description: >-
        The identifier is assigned by the server. `400 invalid_request` for an invalid pattern list or definition ID;
        `404 not_found` for an unknown or foreign repository or definition; `422 hosting_mismatch` for an
        externally hosted repository (use the receive-hook trigger) and `409 repository_archived` for an archived
        one. After an unknown outcome, list the triggers before retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGitTriggerRequest'
            examples:
              main:
                value:
                  repositoryId: repo_01
                  refPatterns: ['refs/heads/main', 'refs/heads/release/*']
                  definitionId: pd_01
      responses:
        '201':
          description: The trigger, with its `Location` and ETag.
          headers:
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
            Location:
              description: The trigger resource.
              schema:
                type: string
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitTrigger'
              examples:
                created:
                  value:
                    triggerId: trg_01
                    repositoryId: repo_01
                    refPatterns: ['refs/heads/main', 'refs/heads/release/*']
                    excludeOriginRuns: true
                    definitionId: pd_01
                    enabled: true
                    configuredBy: usr_01
                    version: 1
                    createdAt: '2026-10-30T10:00:00Z'
                    updatedAt: '2026-10-30T10:00:00Z'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '415':
          $ref: 'common.yaml#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/HostingMismatch'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
  /tenants/{tenantId}/projects/{projectId}/git-triggers/{triggerId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TriggerId'
    get:
      operationId: getGitTrigger
      summary: Read one trigger
      responses:
        '200':
          description: The trigger.
          headers:
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitTrigger'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
    patch:
      operationId: updateGitTrigger
      summary: Alter or disable a trigger
      description: >-
        Under `If-Match`. A member that is absent is unchanged; the repository binding cannot be changed (a trigger for
        another repository is a new trigger). The altering principal becomes `configuredBy`. Enabling re-checks that the
        repository is internal and not archived (`422 hosting_mismatch`, or `409 repository_archived` for an archived
        one: a conflict with the repository's state, not a stale `If-Match`); changing the definition re-checks that
        it is registered. A stale `If-Match` is `412 version_conflict`. Enabling a disabled trigger restarts the
        instant it watches from (`enabledAt`): a push committed before it never starts a run. A change applies to the
        next event: keys already decided are not revisited. A trigger is never deleted.
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGitTriggerRequest'
            examples:
              disable:
                value:
                  enabled: false
      responses:
        '200':
          description: The altered trigger.
          headers:
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitTrigger'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '412':
          $ref: 'common.yaml#/components/responses/PreconditionFailed'
        '415':
          $ref: 'common.yaml#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/HostingMismatch'
        '428':
          $ref: 'common.yaml#/components/responses/PreconditionRequired'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
  /tenants/{tenantId}/projects/{projectId}/git-triggers/{triggerId}/status:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TriggerId'
    get:
      operationId: getGitTriggerStatus
      summary: Read the last decisions taken for a trigger
      description: >-
        The latest decided key and the latest refusal, with their stable reason codes only: never a message, name,
        identifier or secret. A configurer whose run authority was revoked sees `run_authority_denied` here instead
        of a silent failure. Needs the project read role.
      responses:
        '200':
          description: The status.
          headers:
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitStatus'
              examples:
                refused:
                  value:
                    lastDecision:
                      subject: push_02
                      ref: refs/heads/main
                      outcome: rejected
                      reason: run_authority_denied
                      runId: null
                      at: '2026-10-30T10:05:00Z'
                    lastRefusal:
                      subject: push_02
                      ref: refs/heads/main
                      outcome: rejected
                      reason: run_authority_denied
                      runId: null
                      at: '2026-10-30T10:05:00Z'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
  /tenants/{tenantId}/projects/{projectId}/git-task-route/status:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getGitTaskRouteStatus
      summary: Read the last decisions taken for the task route
      description: As the trigger status; `subject` is the work item and its readiness transition.
      responses:
        '200':
          description: The status.
          headers:
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitStatus'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
  /tenants/{tenantId}/projects/{projectId}/git-task-route:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getGitTaskRoute
      summary: Read the project's task route
      responses:
        '200':
          description: The route.
          headers:
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitTaskRoute'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
    post:
      operationId: createGitTaskRoute
      summary: Configure the project's task route
      description: >-
        `409 conflict` when the project already has a route (alter it with `PUT` under `If-Match`); `404 not_found` for an
        unknown or foreign definition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitTaskRouteRequest'
      responses:
        '201':
          description: The route, with its ETag.
          headers:
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitTaskRoute'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '415':
          $ref: 'common.yaml#/components/responses/UnsupportedMediaType'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
    put:
      operationId: replaceGitTaskRoute
      summary: Alter or disable the project's task route
      description: >-
        Under `If-Match`. Replaces the definition and the enabled flag; the altering principal becomes `configuredBy`. A
        disabled route admits nothing; decisions already recorded for a transition are not revisited.
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitTaskRouteRequest'
      responses:
        '200':
          description: The altered route.
          headers:
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
            X-Request-ID:
              $ref: 'common.yaml#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitTaskRoute'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '412':
          $ref: 'common.yaml#/components/responses/PreconditionFailed'
        '415':
          $ref: 'common.yaml#/components/responses/UnsupportedMediaType'
        '428':
          $ref: 'common.yaml#/components/responses/PreconditionRequired'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: 'common.yaml#/components/responses/Unavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        $ref: 'common.yaml#/components/schemas/ID'
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: 'common.yaml#/components/schemas/ID'
    TriggerId:
      name: triggerId
      in: path
      required: true
      description: Trigger identifier.
      schema:
        $ref: 'common.yaml#/components/schemas/ID'
  responses:
    HostingMismatch:
      description: >-
        A native trigger needs an internally hosted repository; an external record keeps the receive-hook trigger
        (hosting_mismatch).
      headers:
        X-Request-ID:
          $ref: 'common.yaml#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: 'common.yaml#/components/schemas/ErrorEnvelope'
  schemas:
    RefPattern:
      type: string
      maxLength: 255
      pattern: '^refs/(heads|tags)/[A-Za-z0-9_][A-Za-z0-9._-]*(/[A-Za-z0-9_][A-Za-z0-9._-]*)*(/\*)?$'
      description: >-
        A full ref name under `refs/heads/` or `refs/tags/` with an optional trailing `/*` after at least one
        component; the wildcard matches one or more further characters, `/` included. The server also refuses
        `refs/heads/*`, an inner wildcard and anything under `refs/kodama/`, and a ref that is not a valid name.
    RefPatterns:
      type: array
      minItems: 1
      maxItems: 32
      uniqueItems: true
      items:
        $ref: '#/components/schemas/RefPattern'
    CreateGitTriggerRequest:
      type: object
      additionalProperties: false
      required: [repositoryId, refPatterns, definitionId]
      properties:
        repositoryId:
          $ref: 'common.yaml#/components/schemas/ID'
        refPatterns:
          $ref: '#/components/schemas/RefPatterns'
        excludeOriginRuns:
          type: boolean
          description: Optional; an omitted member is `true`. A push made by a run does not start a run.
        definitionId:
          $ref: 'common.yaml#/components/schemas/ID'
        enabled:
          type: boolean
          default: true
    UpdateGitTriggerRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        refPatterns:
          $ref: '#/components/schemas/RefPatterns'
        excludeOriginRuns:
          type: boolean
        definitionId:
          $ref: 'common.yaml#/components/schemas/ID'
        enabled:
          type: boolean
    GitTrigger:
      type: object
      additionalProperties: false
      required: [triggerId, repositoryId, refPatterns, excludeOriginRuns, definitionId, enabled, enabledAt, configuredBy, version, createdAt, updatedAt]
      properties:
        triggerId:
          $ref: 'common.yaml#/components/schemas/ID'
        repositoryId:
          $ref: 'common.yaml#/components/schemas/ID'
        refPatterns:
          $ref: '#/components/schemas/RefPatterns'
        excludeOriginRuns:
          type: boolean
          description: Always present in a response (the effective value).
        definitionId:
          $ref: 'common.yaml#/components/schemas/ID'
        enabled:
          type: boolean
        enabledAt:
          type: string
          format: date-time
          description: >-
            When the trigger was created enabled or last re-enabled; a push committed before it never starts a run.
        configuredBy:
          type: string
          minLength: 1
          maxLength: 256
          description: The principal who created or last altered the trigger; admission checks their current run authority.
        version:
          $ref: 'common.yaml#/components/schemas/Version'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GitTriggerList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GitTrigger'
        nextCursor:
          type: string
          nullable: true
    GitTaskRouteRequest:
      type: object
      additionalProperties: false
      required: [definitionId, enabled]
      properties:
        definitionId:
          $ref: 'common.yaml#/components/schemas/ID'
        enabled:
          type: boolean
    GitTaskRoute:
      type: object
      additionalProperties: false
      required: [definitionId, enabled, enabledAt, configuredBy, version, createdAt, updatedAt]
      properties:
        definitionId:
          $ref: 'common.yaml#/components/schemas/ID'
        enabled:
          type: boolean
        enabledAt:
          type: string
          format: date-time
          description: When the route was created enabled or last re-enabled; a readiness committed before it starts nothing.
        configuredBy:
          type: string
          minLength: 1
          maxLength: 256
        version:
          $ref: 'common.yaml#/components/schemas/Version'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GitDecision:
      type: object
      additionalProperties: false
      required: [subject, ref, outcome, reason, runId, at]
      description: One decided key, with stable codes only (never a message, name, identifier or secret).
      properties:
        subject:
          type: string
          maxLength: 512
          description: The push record (trigger) or the work item and its readiness transition (task route).
        ref:
          type: string
          description: The pushed ref; empty for a task route.
        outcome:
          type: string
          enum: [started, ignored, rejected]
        reason:
          type: string
          nullable: true
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: >-
            Null for `started`. For `rejected`, the refusal code (`run_authority_denied`, `work_item_not_actionable`,
            `work_item_cancelled`, `run_purpose_denied`, `admission_invalid`, `admission_target_not_found`, a stable
            admission code such as `source_set_push_repository`, or `admission_refused`). For `ignored` a reason such
            as `ref_deleted`, `entry_not_applied`, `work_item_not_ready`, `work_item_blocked` or `target_not_found`.
        runId:
          type: string
          nullable: true
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$'
        at:
          type: string
          format: date-time
    GitStatus:
      type: object
      additionalProperties: false
      required: [lastDecision, lastRefusal]
      properties:
        lastDecision:
          allOf:
            - $ref: '#/components/schemas/GitDecision'
          nullable: true
        lastRefusal:
          allOf:
            - $ref: '#/components/schemas/GitDecision'
          nullable: true
