actions:
  - name: build
    image: registry.example.com/kodama/build@sha256:44575cf5b28512d75644bf54a517dcef304ff809fd511747621b4d64f19aac66
    commands:
      - build-image
    outputs:
      - candidate
  - name: review
    request: role/reviewer
    subject:
      operation: deployment.approve
      resource: deploy-repo-1
      candidate:
        from: build.outputs.candidate
    outputs:
      - approved
