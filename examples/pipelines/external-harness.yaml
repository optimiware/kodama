# External coding-agent harness recipe (OpenCode, Claude Code, Codex, Pi).
#
# Raw provider credentials (OPENCODE_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY,
# or custom provider keys) are stored as project secrets (`kodema secret set ...`)
# and are NEVER mounted into workload containers. Even in local `kodema up` stacks,
# Kodema refuses to mount LLM-proxy-managed provider secrets via `secrets: [...]`.
#
# Instead, the harness authenticates to Kodema's streaming LLM proxy
# (`/llm/{provider}/*`) by reading the mounted execution credential from
# `/kodema/secrets/KODEMA_TOKEN` into the harness API-key variables while pointing
# at the injected `KODEMA_LLM_<PROVIDER>_BASE_URL` environment variables and
# trusting `$KODEMA_CA_FILE`.
actions:
  - name: prepare
    image: registry.example.com/kodema/base@sha256:cae662172fd450bb0cd710a769079c05bfc5d8e35efa6576edc7d0377afdd4a2
    commands:
      - kodema-example prepare-workspace
  - name: harness
    image: registry.example.com/kodema/harness@sha256:49f756463ad9dcfb9b6ade54d7d6f15476e7214f46a65b4b0c55d46845b12f70
    commands:
      - |
        export ANTHROPIC_BASE_URL="${KODEMA_LLM_ANTHROPIC_BASE_URL:-${KODEMA_URL}/llm/anthropic}"
        export OPENAI_BASE_URL="${KODEMA_LLM_OPENAI_BASE_URL:-${KODEMA_URL}/llm/openai/v1}"
        export OPENCODE_BASE_URL="${KODEMA_LLM_OPENCODE_BASE_URL:-${KODEMA_URL}/llm/opencode/v1}"
        # The credential file has no trailing newline, so read assigns it and reports EOF.
        IFS= read -r ANTHROPIC_API_KEY < /kodema/secrets/KODEMA_TOKEN || [ -n "$ANTHROPIC_API_KEY" ]
        IFS= read -r OPENAI_API_KEY < /kodema/secrets/KODEMA_TOKEN || [ -n "$OPENAI_API_KEY" ]
        IFS= read -r OPENCODE_API_KEY < /kodema/secrets/KODEMA_TOKEN || [ -n "$OPENCODE_API_KEY" ]
        export ANTHROPIC_API_KEY OPENAI_API_KEY OPENCODE_API_KEY
        if [ -n "${KODEMA_CA_FILE:-}" ]; then
          export NODE_EXTRA_CA_CERTS="${KODEMA_CA_FILE}"
          export SSL_CERT_FILE="${KODEMA_CA_FILE}"
          export CURL_CA_BUNDLE="${KODEMA_CA_FILE}"
          export GIT_SSL_CAINFO="${KODEMA_CA_FILE}"
        fi
        harness run --config harness.yaml
      - harness report
