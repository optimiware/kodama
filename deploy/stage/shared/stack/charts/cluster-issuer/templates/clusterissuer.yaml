apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: {{ required "acmeEmail is required" .Values.acmeEmail | quote }}
    server: {{ .Values.acmeServer | quote }}
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.ingressClass | quote }}
