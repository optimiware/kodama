apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kodama-kernel.fullname" . }}-namespaces
  labels:
    {{- include "kodama-kernel.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kodama-kernel.fullname" . }}-namespaces
  labels:
    {{- include "kodama-kernel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kodama-kernel.fullname" . }}-namespaces
subjects:
  - kind: ServiceAccount
    name: {{ include "kodama-kernel.serviceAccount" . }}
    namespace: {{ .Release.Namespace }}
