apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kodama-kernel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kodama-kernel.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kodama-kernel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kodama-kernel.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.server.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kodama-kernel.serviceAccount" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.server.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ include "kodama-kernel.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          args: ["server", "--assembly", "kernel"]
          env:
            - name: KODAMA_ENV
              value: "production"
            - name: KODAMA_ASSEMBLY
              value: "kernel"
            - name: KODAMA_INSTALLATION_ID
              value: {{ .Values.installation.id | quote }}
            - name: KODAMA_HTTP_ADDR
              value: {{ printf ":%d" (int .Values.server.port) | quote }}
            - name: KODAMA_LOG_LEVEL
              value: {{ .Values.server.logLevel | quote }}
            - name: KODAMA_SHUTDOWN_TIMEOUT
              value: {{ .Values.server.shutdownTimeout | quote }}
            - name: KODAMA_PUBLIC_URL
              value: {{ .Values.publicURL | quote }}
            - name: KODAMA_DATABASE_RUNTIME_URL_FILE
              value: /secrets/database-runtime-url
            - name: KODAMA_NATS_URL
              value: {{ .Values.nats.url | quote }}
            - name: KODAMA_NATS_TOKEN_FILE
              value: /secrets/nats-token
            - name: KODAMA_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: KODAMA_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: KODAMA_EXECUTOR
              value: "kubernetes"
            - name: KODAMA_KUBE_CONFIG_FILE
              value: /etc/kodama/kube.json
            - name: KODAMA_KMS_CONFIG_FILE
              value: /etc/kodama/kms.json
            - name: KODAMA_STATE_DIR
              value: /var/lib/kodama
            - name: KODAMA_LOG_DIR
              value: /var/lib/kodama/logs
            - name: KODAMA_GIT_HOSTING
              value: {{ .Values.git.hosting | quote }}
            - name: KODAMA_GIT_EMBEDDED_ACK
              value: {{ .Values.git.embeddedAck | quote }}
            - name: KODAMA_GIT_CONTROL_TOKEN_FILE
              value: /secrets/git-control-token
            - name: KODAMA_GIT_FORWARDING_KEY_FILE
              value: /secrets/git-forwarding-key.pem
            - name: KODAMA_GIT_IDENTITY_KEY_FILE
              value: /secrets/git-identity-key.pem
            - name: KODAMA_GIT_POLL_INTERVAL
              value: {{ .Values.git.pollInterval | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: {{ .Values.server.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.server.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: {{ .Values.server.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.server.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /etc/kodama, readOnly: true}
            - {name: secrets, mountPath: /secrets, readOnly: true}
            - {name: data, mountPath: /var/lib/kodama}
            {{- if eq .Values.kms.provider "scw" }}
            - {name: kms, mountPath: /etc/kodama/kms, readOnly: true}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.server.tmpSizeLimit }}
        - name: config
          configMap: {name: {{ include "kodama-kernel.fullname" . }}-config}
        - name: secrets
          secret:
            secretName: {{ .Values.secrets.runtime.existingSecret }}
            defaultMode: 0440
            items:
              - {key: database-runtime-url, path: database-runtime-url}
              - {key: nats-token, path: nats-token}
              - {key: git-control-token, path: git-control-token}
              - {key: git-forwarding-key.pem, path: git-forwarding-key.pem}
              - {key: git-identity-key.pem, path: git-identity-key.pem}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "kodama-kernel.claim" . }}
        {{- if eq .Values.kms.provider "scw" }}
        - name: kms
          secret:
            secretName: {{ .Values.secrets.kms.existingSecret }}
            defaultMode: 0440
            items:
              - {key: secret-key, path: secret-key}
        {{- end }}
