apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kodama-kernel.serviceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kodama-kernel.labels" . | nindent 4 }}
  {{- with .Values.serviceAccounts.server.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kodama-kernel.migrationServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kodama-kernel.labels" . | nindent 4 }}
  {{- with .Values.serviceAccounts.migration.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
