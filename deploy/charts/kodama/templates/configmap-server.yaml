{{- /*
The server's settings document (config.yaml), read strictly by `kodama server --assembly core`
through KODAMA_CONFIG_FILE (internal/app ChartConfig). It carries endpoints, identifiers and the
Kubernetes execution policy, never a credential value: secrets are files of the runtime Secret
(/secrets) and the runtime trust roots are its runtime-ca.crt file. A variable set on the
Deployment wins over this document; the document never selects the environment or the assembly.
Keep the members in step with ChartConfig: an unknown member stops the server at startup.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kodama.fullname" . }}-config
  labels:
    {{- include "kodama.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  config.yaml: |
    version: 2
    profile: {{ .Values.profile }}
    authority: {{ .Values.authority.mode }}
    installationId: {{ .Values.installation.id | quote }}
    secrets:
      adapter: {{ .Values.secrets.adapter }}
      {{- if eq .Values.secrets.adapter "keyfile" }}
      keyfile:
        {{- toYaml (.Values.secrets.keyfile | default (dict "current" "v1" "files" (dict "v1" "/secrets/master-key"))) | nindent 8 }}
      {{- else }}
      kms:
        provider: {{ .Values.secrets.kms.provider }}
        kekId: {{ .Values.secrets.kms.kekId | quote }}
        current: {{ .Values.secrets.kms.current | quote }}
        startupTimeout: {{ .Values.secrets.kms.startupTimeout | default "10s" | quote }}
        resources:
          {{- toYaml .Values.secrets.kms.resources | nindent 10 }}
        {{- if eq .Values.secrets.kms.provider "aws" }}
        aws:
          region: {{ .Values.secrets.kms.aws.region | quote }}
        {{- end }}
        {{- if eq .Values.secrets.kms.provider "scw" }}
        scw:
          credentialsFile: /etc/kodama/kms-credentials/secret-key
        {{- end }}
      {{- end }}
    nats:
      url: {{ .Values.config.nats.url | quote }}
    s3:
      endpoint: {{ .Values.config.s3.endpoint | quote }}
      region: {{ .Values.config.s3.region | quote }}
      bucket: {{ .Values.config.s3.bucket | quote }}
      prefix: {{ .Values.config.s3.prefix | default "" | quote }}
      pathStyle: {{ .Values.config.s3.pathStyle | default false }}
      credentials: {{ .Values.config.s3.credentials }}
    oidc:
      issuer: {{ .Values.config.oidc.issuer | quote }}
      audience: {{ .Values.config.oidc.audience | quote }}
    tls:
      customCA: {{ .Values.config.tls.customCA | default false }}
    runtime:
      url: {{ .Values.execution.runtime.url | quote }}
      caFile: runtime-ca.crt
      signingGeneration: {{ .Values.execution.runtime.signingGeneration }}
      # Every destination a workload may reach: the callback and the network egress rules. The
      # tenant NetworkPolicy renders the same list.
      egress:
        {{- toYaml (concat .Values.execution.runtime.egress .Values.execution.network.egress) | nindent 8 }}
    execution:
      serviceAccountName: {{ .Values.execution.serviceAccountName | quote }}
      tenants:
        {{- range .Values.execution.tenants }}
        - namespace: {{ .namespace | quote }}
          tenantId: {{ .tenantId | quote }}
        {{- end }}
      image: {{ include "kodama.releaseImage" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
      injectorCommand:
        {{- include "kodama.injectCommand" . | nindent 8 }}
      runAsUser: {{ .Values.execution.job.runAsUser }}
      runAsGroup: {{ .Values.execution.job.runAsGroup }}
      terminationGraceSeconds: {{ .Values.execution.job.terminationGracePeriodSeconds }}
      workload:
        {{- toYaml .Values.execution.job.resources | nindent 8 }}
      injector:
        {{- toYaml .Values.execution.job.injectorResources | nindent 8 }}
      volumes:
        {{- toYaml .Values.execution.volumes | nindent 8 }}
    {{- if .Values.runShared.enabled }}
    {{- if not .Values.execution.rbac.manageSecrets }}
    {{- fail "runShared.enabled requires execution.rbac.manageSecrets=true: every run resource keeps its record and admission credential in a Secret of the tenant namespace" }}
    {{- end }}
    {{- $step := .Values.runShared.policy.roles.step }}
    {{- if and (or (ne $step.seccomp "RuntimeDefault") $step.lsm) (not .Values.runShared.nodeProfilesInstalled) }}
    {{- fail "runShared.enabled needs the node profiles named by the step role (seccomp, lsm) installed on every worker node: install deploy/profiles/run-builders (docs/operations/run-builder-profile.md), confirm one Ready installer Pod per node, then set runShared.nodeProfilesInstalled=true" }}
    {{- end }}
    # The run_shared model (O-30). Present only when runShared.enabled: an installation without it keeps
    # kodama/v1alpha2 registration and admission closed. The policies are the append-only list of
    # execution policies (the last is current); `admission` inside them decides whether new runs are
    # admitted.
    runShared:
      identity:
        runAsUser: {{ .Values.runShared.identity.runAsUser }}
        runAsGroup: {{ .Values.runShared.identity.runAsGroup }}
        fsGroup: {{ .Values.runShared.identity.fsGroup }}
      clusterCIDRs: {{ toJson .Values.runShared.clusterCIDRs }}
      builderRootless: {{ .Values.runShared.builderRootless }}
      policies:
        {{- include "kodama.runSharedPolicies" . | trim | nindent 8 }}
    {{- end }}
