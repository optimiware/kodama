{{- $create := true }}
{{- if .Values.serviceAccount }}
{{- if hasKey .Values.serviceAccount "create" }}
{{- $create = .Values.serviceAccount.create }}
{{- end }}
{{- end }}
{{- if $create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ if .Values.serviceAccount }}{{ .Values.serviceAccount.name | default "kodama" }}{{ else }}kodama{{ end }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kodama
    app.kubernetes.io/component: control-plane
  {{- if and .Values.serviceAccount .Values.serviceAccount.annotations }}
  annotations:
    {{- range $key, $value := .Values.serviceAccount.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
{{- end }}
