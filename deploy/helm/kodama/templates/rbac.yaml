{{- /*
Control-plane RBAC, scoped to the configured tenant execution namespaces. Namespaced Roles only;
no cluster-admin, no wildcards. The one ClusterRole can only `get` the named tenant namespaces
(to verify Pod Security labels) and create SubjectAccessReviews (the preflight of the tenant service account). Secrets access is off unless execution.rbac.manageSecrets=true.
*/ -}}
{{- range .Values.execution.tenants }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kodama.fullname" $ }}-control-plane
  namespace: {{ .namespace }}
  labels:
    {{- include "kodama.labels" $ | nindent 4 }}
    app.kubernetes.io/component: execution-rbac
rules:
  # Attempt Jobs: created, observed and deleted by the control plane (T-021).
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Read-only tenant namespace policy checks.
  - apiGroups: [""]
    resources: ["serviceaccounts", "resourcequotas", "limitranges"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
  {{- if $.Values.runShared.enabled }}
  # run_shared (O-30): the run scratch claim, the support services' Pods and Services and the per-run
  # NetworkPolicies are created and deleted by the control plane in the tenant namespace; Pod creation
  # is for service Pods only (a preparation and the attempts are Jobs).
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "services"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete"]
  {{- end }}
  {{- if $.Values.execution.rbac.manageSecrets }}
  - apiGroups: [""]
    resources: ["secrets"]
    # update is required: the admission Secret's workload annotation is replaced as the attempt moves
    # (credentialed -> registered -> create issued -> owned). create/get/list/delete alone leave every
    # dispatch unable to save that record.
    verbs: ["create", "get", "list", "update", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kodama.fullname" $ }}-control-plane
  namespace: {{ .namespace }}
  labels:
    {{- include "kodama.labels" $ | nindent 4 }}
    app.kubernetes.io/component: execution-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kodama.fullname" $ }}-control-plane
subjects:
  - kind: ServiceAccount
    name: {{ include "kodama.serverServiceAccount" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- if .Values.execution.tenants }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s-tenant-namespaces" (include "kodama.fullname" .) .Release.Namespace | trunc 253 | trimSuffix "-" }}
  labels:
    {{- include "kodama.labels" . | nindent 4 }}
    app.kubernetes.io/component: execution-rbac
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
    resourceNames:
      {{- range .Values.execution.tenants }}
      - {{ .namespace }}
      {{- end }}
  # The tenant preflight asks the API server what the tenant's execution service account may do
  # (SubjectAccessReview records nothing and grants nothing); without it every dispatch is refused.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  {{- if .Values.runShared.enabled }}
  # run_shared (O-30): the run scratch claim is released only when no Pod uses it and no
  # VolumeAttachment of its volume remains (volumes are found by their claimRef), and the claim's storage
  # class is read to confirm delete reclaim. Read access only: the controller never writes these.
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-tenant-namespaces" (include "kodama.fullname" .) .Release.Namespace | trunc 253 | trimSuffix "-" }}
  labels:
    {{- include "kodama.labels" . | nindent 4 }}
    app.kubernetes.io/component: execution-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s-tenant-namespaces" (include "kodama.fullname" .) .Release.Namespace | trunc 253 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kodama.serverServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
