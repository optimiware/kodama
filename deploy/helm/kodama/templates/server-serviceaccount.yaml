apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kodama.serverServiceAccount" . }}
  labels:
    {{- include "kodama.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.serviceAccounts.server.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
