{{- /*
Per-tenant-namespace guardrails: ResourceQuota, LimitRange and NetworkPolicies. Default deny for
ingress and egress, then explicit address-block egress only: the runtime callback destination
(execution.runtime.egress) and the CIDR rules in execution.network.egress. These are exactly the
destinations of the server's execution policy (the settings document renders the same list), and
the server's namespace preflight refuses any other egress shape: no DNS rule and no Pod or
namespace selector peers, so workloads reach destinations by address. There is no rule for
PostgreSQL or NATS.
*/ -}}
{{- range .Values.execution.tenants }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: kodama-execution
  namespace: {{ .namespace }}
  labels:
    {{- include "kodama.labels" $ | nindent 4 }}
    app.kubernetes.io/component: tenant-execution
  annotations:
    helm.sh/resource-policy: keep
spec:
  hard:
    {{- toYaml $.Values.execution.quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: kodama-execution
  namespace: {{ .namespace }}
  labels:
    {{- include "kodama.labels" $ | nindent 4 }}
    app.kubernetes.io/component: tenant-execution
  annotations:
    helm.sh/resource-policy: keep
spec:
  limits:
    - type: Container
      default:
        {{- toYaml $.Values.execution.limitRange.default | nindent 8 }}
      defaultRequest:
        {{- toYaml $.Values.execution.limitRange.defaultRequest | nindent 8 }}
      max:
        {{- toYaml $.Values.execution.limitRange.max | nindent 8 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .namespace }}
  labels:
    {{- include "kodama.labels" $ | nindent 4 }}
    app.kubernetes.io/component: tenant-execution
  annotations:
    helm.sh/resource-policy: keep
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# Always rendered, even with no rules: Helm never deletes a `keep` resource, so an
# operator who empties execution.network.egress must see the old rules replaced in place.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-egress
  namespace: {{ .namespace }}
  labels:
    {{- include "kodama.labels" $ | nindent 4 }}
    app.kubernetes.io/component: tenant-execution
  annotations:
    helm.sh/resource-policy: keep
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    {{- range $.Values.execution.runtime.egress }}
    # runtime callback: {{ .name }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
            {{- with .except }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
      ports:
        {{- range .ports }}
        - protocol: {{ .protocol | default "TCP" }}
          port: {{ .port }}
        {{- end }}
    {{- end }}
    {{- range $.Values.execution.network.egress }}
    # {{ .name }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
            {{- with .except }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
      ports:
        {{- range .ports }}
        - protocol: {{ .protocol | default "TCP" }}
          port: {{ .port }}
        {{- end }}
    {{- end }}
{{- end }}
