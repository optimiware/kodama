name: Release

# A change of the VERSION file on master publishes that version: the kodama
# image and both Helm charts to GHCR, and a GitHub release with the kodactl
# archives, the chart packages and SHA256SUMS. The workflow creates the tag
# v<VERSION> itself. A development version (-dev) and a manual run build
# everything and publish nothing, unless the manual run asks to publish from
# master. A version that is already released is never replaced.
# See docs/runbooks/release.md.
on:
  push:
    branches: [master]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the version in VERSION. Only on master; off builds everything and publishes nothing."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      # The packages live under the repository name: ghcr.io/<owner>/kodama
      # belongs to the archived v1 repository and this workflow cannot write it.
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/kodama
      CHART_REGISTRY: oci://ghcr.io/${{ github.repository }}/charts
      GH_TOKEN: ${{ github.token }}
      PUBLISH_INPUT: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      # Sets VERSION, PUBLISH and PRERELEASE for the steps below.
      - name: Resolve the version
        run: |
          version="$(cat VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION '${version}' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$PUBLISH_INPUT" == "true" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
              echo "::error::a version is published from master, not from ${GITHUB_REF}"
              exit 1
            fi
            if [[ "$version" == *-dev* ]]; then
              if [[ "$PUBLISH_INPUT" == "true" ]]; then
                echo "::error::${version} is a development version and is never published"
                exit 1
              fi
              echo "::notice::${version} is a development version: building everything, publishing nothing"
            else
              # The GitHub release is created last, so it marks a complete
              # publication. Only "not found" lets the run continue: an API
              # failure must not be read as "not released yet".
              if found="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${version}" --jq .tag_name 2>&1)"; then
                echo "::error::version ${version} is already released (${found}). A released version is never replaced; set the next one with scripts/release-prepare."
                exit 1
              elif [[ "$found" != *"HTTP 404"* ]]; then
                echo "::error::cannot tell whether ${version} is released: ${found}"
                exit 1
              fi
              tagged="$(git ls-remote origin "refs/tags/v${version}" "refs/tags/v${version}^{}" | tail -n 1 | cut -f 1)"
              if [[ -n "$tagged" && "$tagged" != "$GITHUB_SHA" ]]; then
                echo "::error::the tag v${version} exists on ${tagged}, not on this commit ${GITHUB_SHA}"
                exit 1
              fi
              publish=true
            fi
          fi
          prerelease=false
          if [[ "$version" == 0.0.* || "$version" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "VERSION=${version}"
            echo "PUBLISH=${publish}"
            echo "PRERELEASE=${prerelease}"
          } >>"$GITHUB_ENV"
          echo "version ${version}, publish ${publish}, prerelease ${prerelease}"

      - name: Enable multi-arch container runtime support
        run: |
          sudo apt-get update
          # qemu-user-binfmt registers the emulators the arm64 image stage runs
          # under; socat serves the installation check's TLS front ends.
          sudo apt-get install -y --no-install-recommends qemu-user-binfmt socat

      - name: Build the release artifacts
        run: make dist

      - name: Build the image
        run: |
          ref="$(scripts/image build --repository "$IMAGE_REPOSITORY" --tag "$VERSION")"
          line="$(podman run --rm "$ref" version)"
          echo "$line"
          [[ "$line" == "kodama ${VERSION} (revision ${GITHUB_SHA},"* ]] || { echo "::error::the image reports another version or revision"; exit 1; }
          if [[ "$PUBLISH" != "true" ]]; then
            scripts/image build --repository "$IMAGE_REPOSITORY" --tag "${VERSION}-multiarch" --platforms linux/amd64,linux/arm64
          fi

      # The gate before anything is pushed: the image must install with the
      # Podman bundle and run a pipeline.
      - name: Install the image and run a pipeline
        run: |
          socket="${RUNNER_TEMP}/podman.sock"
          podman system service --time=0 "unix://${socket}" &
          service=$!
          trap 'kill "$service" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            [[ -S "$socket" ]] && break
            sleep 1
          done
          KODAMA_LOCAL_PODMAN_SOCKET="$socket" scripts/release-smoke --image "${IMAGE_REPOSITORY}:${VERSION}"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        run: |
          printf '%s' "$GH_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push the image
        if: env.PUBLISH == 'true'
        run: |
          extra_args=(--platforms linux/amd64,linux/arm64)
          if [[ "$PRERELEASE" == "false" ]]; then
            extra_args+=(--also-tag latest)
          fi
          reference="$(scripts/image build-push --repository "$IMAGE_REPOSITORY" --tag "$VERSION" "${extra_args[@]}")"
          echo "IMAGE_REFERENCE=${reference}" >>"$GITHUB_ENV"
          echo "pushed ${reference}"

      - name: Push the charts
        if: env.PUBLISH == 'true'
        run: |
          helm push "dist/kodama-${VERSION}.tgz" "$CHART_REGISTRY"
          helm push "dist/kodama-stack-${VERSION}.tgz" "$CHART_REGISTRY"

      - name: Publish the GitHub release
        if: env.PUBLISH == 'true'
        run: |
          image_tags="tag \`${VERSION}\`"
          if [[ "$PRERELEASE" == "false" ]]; then
            image_tags="tags \`${VERSION}\`, \`latest\`"
          fi
          {
            echo "## Artifacts"
            echo
            echo "| Artifact | Reference |"
            echo "|---|---|"
            echo "| Image (\`linux/amd64\`, \`linux/arm64\`) | \`${IMAGE_REFERENCE}\` (${image_tags}) |"
            echo "| Chart \`kodama\` | \`${CHART_REGISTRY}/kodama\` version \`${VERSION}\` |"
            echo "| Chart \`kodama-stack\` | \`${CHART_REGISTRY}/kodama-stack\` version \`${VERSION}\` |"
            echo "| \`kodactl\` | the archives below; verify with \`sha256sum --check SHA256SUMS\` |"
            echo
            echo "Source revision: \`${GITHUB_SHA}\`. Changes and known limitations: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md)."
          } >"${RUNNER_TEMP}/notes.md"
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          # Creates the tag v<VERSION> on this commit when it does not exist.
          gh release create "v${VERSION}" dist/* --target "$GITHUB_SHA" \
            --title "Kodama ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md" "${flags[@]}"
