name: Publish image
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Containerfile
      - .dockerignore
      - VERSION
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - contracts/**
      - pkg/**
      - api/**
      - scripts/release/**
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kodama-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Semver tag planner
        run: python3 -m unittest scripts/release/test_version.py

  verify:
    if: github.event_name == 'pull_request'
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the release image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: localhost/kodama:pr
          build-args: |
            VERSION=0.0.0-pr
            REVISION=${{ github.sha }}
      - name: Smoke-test the binary
        run: docker run --rm localhost/kodama:pr --help

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch semver tags
        run: git fetch origin --force '+refs/tags/*:refs/tags/*'
      - name: Plan the patch tag
        id: version
        run: python3 scripts/release/version.py plan --github-output "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kodama:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/kodama:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tag the commit
        if: steps.version.outputs.create_tag == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "kodama $VERSION"
          git push origin "refs/tags/$VERSION"
