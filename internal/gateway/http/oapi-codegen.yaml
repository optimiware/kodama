# Types only, like internal/httpapi: no router, client, server or embedded spec.
# References into api/common.yaml are mapped to the shared httpapi package
# (generated from the same file), so common types are not duplicated here.
package: gatewayhttp
output: gateway.gen.go
generate:
  models: true
output-options:
  skip-prune: true
import-mapping:
  common.yaml: github.com/optimiware/kodama/internal/httpapi
